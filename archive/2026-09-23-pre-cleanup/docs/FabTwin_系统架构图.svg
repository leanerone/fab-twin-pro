<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
    <linearGradient id="feGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#43a047"/>
    </linearGradient>
    <linearGradient id="beGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#fb8c00"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="100%" stop-color="#8e24aa"/>
    </linearGradient>
    <linearGradient id="srcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e57373"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#78909c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#43a047"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e88e5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#f8fafc"/>

  <!-- Layer backgrounds -->
  <rect x="20" y="10" width="860" height="110" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="20" y="140" width="860" height="200" rx="8" fill="#fff3e0" stroke="#ffcc80" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="20" y="360" width="860" height="100" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="20" y="480" width="860" height="100" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Layer labels -->
  <text x="30" y="30" font-size="12" font-weight="bold" fill="#1565c0" font-family="Microsoft YaHei, Arial">前端层 (Vue3 + Vite)</text>
  <text x="30" y="160" font-size="12" font-weight="bold" fill="#e65100" font-family="Microsoft YaHei, Arial">后端层 (FastAPI)</text>
  <text x="30" y="380" font-size="12" font-weight="bold" fill="#6a1b9a" font-family="Microsoft YaHei, Arial">数据库层 (Oracle 19c / SQLite)</text>
  <text x="30" y="500" font-size="12" font-weight="bold" fill="#c62828" font-family="Microsoft YaHei, Arial">源系统层 (TIBRV / MES / RCMS / FDC)</text>

  <!-- ========== Frontend Layer ========== -->
  <!-- Main Frontend Box -->
  <rect x="50" y="45" width="800" height="60" rx="6" fill="url(#userGrad)" filter="url(#shadow)"/>
  <text x="450" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">用户浏览器 (Vue3)</text>
  <text x="450" y="88" text-anchor="middle" font-size="11" fill="#e3f2fd" font-family="Microsoft YaHei, Arial">看板  /  机台详情  /  平面图编辑  /  历史回放  /  AI助手</text>

  <!-- ========== Backend Layer ========== -->
  <!-- Router Box -->
  <rect x="50" y="175" width="140" height="130" rx="6" fill="#fff" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="175" width="140" height="28" rx="6" fill="url(#beGrad)"/>
  <text x="120" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">12个路由模块</text>
  <text x="120" y="218" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">machines</text>
  <text x="120" y="234" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">events / lots</text>
  <text x="120" y="250" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">alarms / ai</text>
  <text x="120" y="266" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">floors / history</text>
  <text x="120" y="282" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">auth / models...</text>

  <!-- DB Poller Box -->
  <rect x="210" y="175" width="140" height="130" rx="6" fill="#fff" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="210" y="175" width="140" height="28" rx="6" fill="url(#beGrad)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">DB轮询服务</text>
  <text x="280" y="220" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">db_poller.py</text>
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">每秒轮询新事件</text>
  <text x="280" y="260" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">增量查询 + 索引</text>
  <text x="280" y="285" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">WebSocket推送</text>

  <!-- WS Manager Box -->
  <rect x="370" y="175" width="140" height="130" rx="6" fill="#fff" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="370" y="175" width="140" height="28" rx="6" fill="url(#beGrad)"/>
  <text x="440" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">WS管理器</text>
  <text x="440" y="220" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">realtime.py</text>
  <text x="440" y="240" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">实时广播</text>
  <text x="440" y="260" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">指数退避重连</text>
  <text x="440" y="285" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">连接池管理</text>

  <!-- AI Middleware Box -->
  <rect x="530" y="175" width="140" height="130" rx="6" fill="#fff" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="530" y="175" width="140" height="28" rx="6" fill="url(#beGrad)"/>
  <text x="600" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">AI中间件</text>
  <text x="600" y="218" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">多Provider支持</text>
  <text x="600" y="234" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">智谱GLM / OpenAI</text>
  <text x="600" y="250" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">Token统计</text>
  <text x="600" y="266" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">Function Calling</text>
  <text x="600" y="282" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">配置持久化</text>

  <!-- Simulator Box -->
  <rect x="690" y="175" width="160" height="60" rx="6" fill="#fff" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="690" y="175" width="160" height="28" rx="6" fill="url(#beGrad)"/>
  <text x="770" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">模拟器</text>
  <text x="770" y="220" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">内部模拟器 + WinForm(tkinter)</text>

  <!-- Cache Box -->
  <rect x="690" y="250" width="160" height="55" rx="6" fill="#fff" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="690" y="250" width="160" height="28" rx="6" fill="url(#beGrad)"/>
  <text x="770" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">缓存 (Redis)</text>
  <text x="770" y="292" text-anchor="middle" font-size="10" fill="#555" font-family="Microsoft YaHei, Arial">内存回退兜底</text>

  <!-- ========== Database Layer ========== -->
  <!-- DT Tables -->
  <rect x="50" y="395" width="260" height="50" rx="6" fill="url(#dbGrad)" filter="url(#shadow)"/>
  <text x="180" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">DT系列表 (量产数据)</text>
  <text x="180" y="432" text-anchor="middle" font-size="10" fill="#e1bee7" font-family="Microsoft YaHei, Arial">DT_EVENT_RAW  /  DT_EVENT_RAW_CUR  /  DT_STATE_SNAPSHOT</text>

  <!-- Business Tables -->
  <rect x="330" y="395" width="240" height="50" rx="6" fill="url(#dbGrad)" filter="url(#shadow)"/>
  <text x="450" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">业务扩展表 (19张)</text>
  <text x="450" y="432" text-anchor="middle" font-size="10" fill="#e1bee7" font-family="Microsoft YaHei, Arial">machines  /  lots  /  recipes  /  alarms  /  floors ...</text>

  <!-- AI Tables -->
  <rect x="590" y="395" width="260" height="50" rx="6" fill="url(#dbGrad)" filter="url(#shadow)"/>
  <text x="720" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">AI配置表 (3张)</text>
  <text x="720" y="432" text-anchor="middle" font-size="10" fill="#e1bee7" font-family="Microsoft YaHei, Arial">AI_CONFIGS  /  AI_PROVIDER_CONFIGS  /  AI_USAGE_LOGS</text>

  <!-- ========== Source Layer ========== -->
  <rect x="50" y="515" width="200" height="50" rx="6" fill="url(#srcGrad)" filter="url(#shadow)"/>
  <text x="150" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">TIBRV 消息总线</text>
  <text x="150" y="552" text-anchor="middle" font-size="10" fill="#ffcdd2" font-family="Microsoft YaHei, Arial">真实事件流 (待对接)</text>

  <rect x="270" y="515" width="160" height="50" rx="6" fill="url(#srcGrad)" filter="url(#shadow)"/>
  <text x="350" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">MES</text>
  <text x="350" y="552" text-anchor="middle" font-size="10" fill="#ffcdd2" font-family="Microsoft YaHei, Arial">制造执行系统</text>

  <rect x="450" y="515" width="160" height="50" rx="6" fill="url(#srcGrad)" filter="url(#shadow)"/>
  <text x="530" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">RCMS</text>
  <text x="530" y="552" text-anchor="middle" font-size="10" fill="#ffcdd2" font-family="Microsoft YaHei, Arial">配方管理系统</text>

  <rect x="630" y="515" width="220" height="50" rx="6" fill="url(#srcGrad)" filter="url(#shadow)"/>
  <text x="740" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Microsoft YaHei, Arial">FDC</text>
  <text x="740" y="552" text-anchor="middle" font-size="10" fill="#ffcdd2" font-family="Microsoft YaHei, Arial">故障检测与分类</text>

  <!-- ========== Connection Arrows ========== -->
  <!-- Frontend -> Backend REST API -->
  <line x1="250" y1="105" x2="250" y2="165" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="255" y="140" font-size="10" fill="#1e88e5" font-family="Microsoft YaHei, Arial">REST API</text>

  <!-- Frontend -> Backend WebSocket -->
  <line x1="650" y1="105" x2="650" y2="165" stroke="#43a047" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="655" y="140" font-size="10" fill="#43a047" font-family="Microsoft YaHei, Arial">WebSocket</text>

  <!-- Backend -> Database -->
  <line x1="450" y1="340" x2="450" y2="385" stroke="#8e24aa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="368" font-size="10" fill="#8e24aa" font-family="Microsoft YaHei, Arial">SQLAlchemy ORM</text>

  <!-- Database -> Source (ODS sync) -->
  <line x1="450" y1="450" x2="450" y2="505" stroke="#78909c" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="455" y="482" font-size="10" fill="#78909c" font-family="Microsoft YaHei, Arial">ODS同步(预留)</text>

  <!-- Internal Backend connections (dotted) -->
  <line x1="190" y1="240" x2="210" y2="240" stroke="#fb8c00" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="350" y1="240" x2="370" y2="240" stroke="#fb8c00" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="510" y1="240" x2="530" y2="240" stroke="#fb8c00" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Legend -->
  <rect x="680" y="620" width="200" height="65" rx="6" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
  <text x="690" y="638" font-size="11" font-weight="bold" fill="#333" font-family="Microsoft YaHei, Arial">图例</text>
  <line x1="690" y1="645" x2="870" y2="645" stroke="#eee" stroke-width="1"/>
  <line x1="690" y1="655" x2="740" y2="655" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="748" y="659" font-size="9" fill="#555" font-family="Microsoft YaHei, Arial">REST API</text>
  <line x1="690" y1="670" x2="740" y2="670" stroke="#43a047" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="748" y="674" font-size="9" fill="#555" font-family="Microsoft YaHei, Arial">WebSocket</text>
  <line x1="800" y1="655" x2="850" y2="655" stroke="#8e24aa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="670" font-size="9" fill="#555" font-family="Microsoft YaHei, Arial">ORM数据流</text>

  <!-- Title -->
  <text x="450" y="690" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c" font-family="Microsoft YaHei, Arial">FabTwin Pro 系统架构图</text>
</svg>
