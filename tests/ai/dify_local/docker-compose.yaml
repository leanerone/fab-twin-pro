services:
  api:
    image: langgenius/dify-api:0.10.3
    restart: always
    environment:
      MODE: api
      SECRET_KEY: fabtwin-secret-key-20261101
      INIT_PASSWORD: FabTwin#2026!Dify
      DB_USERNAME: postgres
      DB_PASSWORD: difyaipass
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: difyredis
      CELERY_BROKER_URL: redis://:difyredis@redis:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      VECTOR_STORE: weaviate
      SANDBOX_API_URL: http://sandbox:8194
      CONSOLE_API_URL: http://localhost:8088
      CONSOLE_WEB_URL: http://localhost:3088
      SERVICE_API_URL: http://localhost:8088/v1
      APP_API_URL: http://localhost:8088
      APP_WEB_URL: http://localhost:3088
      MIGRATION_ENABLED: "true"
      TZ: Asia/Shanghai
      NGINX_SERVER_NAME: localhost
    depends_on:
      - postgres
      - redis
      - weaviate
      - sandbox
    ports:
      - "8088:5001"
    volumes:
      - ./volumes/app/storage:/app/api/storage

  worker:
    image: langgenius/dify-api:0.10.3
    restart: always
    environment:
      MODE: worker
      SECRET_KEY: fabtwin-secret-key-20261101
      DB_USERNAME: postgres
      DB_PASSWORD: difyaipass
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: difyredis
      CELERY_BROKER_URL: redis://:difyredis@redis:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      VECTOR_STORE: weaviate
      TZ: Asia/Shanghai
    depends_on:
      - postgres
      - redis
      - weaviate
    volumes:
      - ./volumes/app/storage:/app/api/storage

  web:
    image: langgenius/dify-web:0.10.3
    restart: always
    environment:
      CONSOLE_API_URL: http://localhost:8088
      APP_API_URL: http://localhost:8088
      SERVICE_API_URL: http://localhost:8088/v1
      APP_WEB_URL: http://localhost:3088
    ports:
      - "3088:3000"

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: difyaipass
      POSTGRES_DB: dify
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
    command: postgres -c max_connections=200

  redis:
    image: redis:6-alpine
    restart: always
    command: redis-server --requirepass difyredis
    ports:
      - "6380:6379"
    volumes:
      - ./volumes/redis/data:/data

  weaviate:
    image: semitechnologies/weaviate:1.25.4
    restart: always
    environment:
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      AUTHENTICATION_APIKEY_USERS: hello@dify.ai
      QUERY_DEFAULTS_LIMIT: "25"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      TZ: Asia/Shanghai
    ports:
      - "8089:8080"
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate

  sandbox:
    image: langgenius/dify-sandbox:0.2.1
    restart: always
    environment:
      API_KEY: fabtwin-sandbox-key
      TZ: Asia/Shanghai
    ports:
      - "8194:8194"
