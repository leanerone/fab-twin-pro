<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OXE SVG 布局编辑器</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Arial,'Microsoft YaHei',sans-serif;background:#0f172a;color:#e2e8f0;overflow:hidden}
  #app{display:flex;height:100%}
  #canvasWrap{flex:1;position:relative;overflow:hidden;background:
     radial-gradient(circle,#1e293b 1px,transparent 1px);background-size:24px 24px;background-color:#f1f5f9}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0}
  #overlay{position:absolute;inset:0;pointer-events:none;z-index:20}
  .handle{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid #fff;
          pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);box-shadow:0 0 3px rgba(0,0,0,.5)}
  .handle.frame{background:#dc2626}.handle.bore{background:#f59e0b}
  .handle.move{background:#2563eb;cursor:grab;border-radius:3px;width:11px;height:11px}
  .bbox{position:absolute;border:1.5px dashed #dc2626;pointer-events:none}
  .axislbl{position:absolute;font-size:10px;color:#dc2626;background:rgba(255,255,255,.85);padding:0 3px;border-radius:3px;pointer-events:none}
  #stage svg{display:block;background:transparent;width:1080px;height:840px}
  /* 可编辑部件悬停/选中 */
  .editable{cursor:move}
  .editable:hover{outline:2px dashed rgba(37,99,235,.7);outline-offset:1px}
  .editable.sel{outline:2.5px solid #dc2626;outline-offset:2px}
  .editable.sel:hover{outline-color:#dc2626}
  /* 面板 */
  #panel{width:268px;background:#0f172a;border-left:1px solid #1e293b;display:flex;flex-direction:column;overflow:hidden}
  #panel h2{font-size:14px;margin:0;padding:14px 14px 6px}
  .psec{padding:10px 14px;border-bottom:1px solid #1e293b}
  .psec h3{font-size:11px;color:#94a3b8;text-transform:uppercase;margin:0 0 8px;letter-spacing:.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button{padding:8px;border:0;border-radius:6px;background:#334155;color:#fff;font-size:12px;cursor:pointer;font-weight:600}
  button:hover{background:#475569}
  button.primary{background:#2563eb}button.primary:hover{background:#1d4ed8}
  button.danger{background:#7f1d1d}button.danger:hover{background:#991b1b}
  label{font-size:11px;color:#94a3b8;display:block;margin:6px 0 2px}
  input[type=number],input[type=text],select{width:100%;padding:6px;border-radius:5px;border:1px solid #334155;background:#020617;color:#e2e8f0;font-size:12px}
  .rowline{display:flex;align-items:center;gap:8px;margin:4px 0}
  .rowline input[type=range]{flex:1}
  #selName{font-size:13px;font-weight:700;color:#7dd3fc;margin-bottom:4px;word-break:break-all}
  #selHint{font-size:10.5px;color:#64748b;line-height:1.5;margin-bottom:6px}
  #partList{max-height:150px;overflow-y:auto;font-size:11px}
  .pli{padding:4px 6px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between}
  .pli:hover{background:#1e293b}.pli.sel{background:#3b1d1d;color:#fca5a5}
  .pli .ty{color:#64748b;font-size:10px}
  #status{position:absolute;left:12px;bottom:10px;background:rgba(15,23,42,.85);color:#fff;padding:7px 11px;border-radius:7px;font-size:11.5px}
  #help{position:absolute;left:12px;top:10px;background:rgba(15,23,42,.85);color:#cbd5e1;padding:9px 12px;border-radius:8px;font-size:11px;line-height:1.6;max-width:330px}
  kbd{background:#334155;border-radius:3px;padding:0 5px;color:#fff;font-size:10px}
  .toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
</style>
</head>

      <b>移动画布</b>：按住<kbd>空格</kbd>拖动 或 鼠标中键拖；空白处<kbd>滚轮</kbd>缩放视图（在部件上滚轮=缩放部件）<br>
      选中 <b>PORT_SLIT / CH_SLIT / PA_SLIT 管道</b> 出现 <span style="color:#dc2626">红/橙四角</span>，拖角改变形状 · 最后<b>导出 SVG</b>

<script>
const SVGNS="http://www.w3.org/2000/svg";
const stage=document.getElementById('stage');
const wrap=document.getElementById('canvasWrap');
const status=document.getElementById('status');
const toastEl=document.getElementById('toast');

// 自动收集：SVG 里所有带 id 的顶层 g，以及带 id 的独立 rect（底板）。
// 不再手维护清单 —— 状态覆盖层/晶圆/面板/底板/图例全部可移动。
// 排除内部辅助元素（__ 开头为编辑器自身）。
function collectPartIds(){
  const ids=[];
  // 顶层 g 与带 id 的 rect/polygon（svg 直接子级）
  [...svgEl.children].forEach(ch=>{
    const id=ch.id||ch.getAttribute&&ch.getAttribute('id');
    if(id && !id.startsWith('__') && ['g','rect','polygon','ellipse'].includes(ch.tagName.toLowerCase())){
      ids.push(id);
    }
  });
  return ids;
}
let MAIN_PARTS=[];

let svgEl=null, viewVB={x:0,y:0,w:1080,h:840}, scale=1, parts=[];
let addSeq=1;

function toast(m){toastEl.textContent=m;toastEl.style.opacity=1;setTimeout(()=>toastEl.style.opacity=0,1600);}

// 加载：优先内联模板（file:// 双击可用），否则 fetch 同目录 svg
async function load(){
  let txt=null;
  const tpl=document.getElementById('__SVG_TEMPLATE__');
  if(tpl && tpl.textContent.trim()){ txt=tpl.textContent; }
  else{
    try{
      const r=await fetch('oxe-drm-topview.svg?z='+Date.now(),{cache:'no-store'});
      txt=await r.text();
    }catch(e){ status.textContent='加载失败（请用 http 打开或使用 standalone 版）: '+e.message; return; }
  }
  stage.innerHTML=txt;
  svgEl=stage.querySelector('svg');
  const vb=(svgEl.getAttribute('viewBox')||'0 0 1080 840').split(/\s+/).map(Number);
  viewVB={x:vb[0],y:vb[1],w:vb[2],h:vb[3]};
  // 显式尺寸（关键：无 width/height 的内联 SVG 在 file:// 下会算成 0 导致空白）
  svgEl.setAttribute('width',viewVB.w);svgEl.setAttribute('height',viewVB.h);
  svgEl.style.width=viewVB.w+'px';svgEl.style.height=viewVB.h+'px';
  initMarquee();
  initCornerLayer();
  MAIN_PARTS=collectPartIds();
  initParts();fit();
}

// 框选矩形（覆盖在部件之上）
function initMarquee(){
  marqueeEl=document.createElementNS(SVGNS,'rect');
  marqueeEl.setAttribute('fill','rgba(37,99,235,0.12)');
  marqueeEl.setAttribute('stroke','#2563eb');
  marqueeEl.setAttribute('stroke-width','1.5');
  marqueeEl.setAttribute('stroke-dasharray','4,3');
  marqueeEl.setAttribute('pointer-events','none');
  marqueeEl.style.display='none';
  svgEl.appendChild(marqueeEl);
}

function transformOf(g){
  const m=g.getCTM();
  // 以 SVG viewBox 坐标读取几何中心
  const b=g.getBBox();
  return { cx:b.x+b.width/2, cy:b.y+b.height/2, w:b.width, h:b.height };
}

// 每个可编辑部件用外层 translate/rotate/scale 包裹（不改内部路径）
function initParts(){
  parts=[];
  MAIN_PARTS.forEach(id=>{
    const g=svgEl.querySelector('#'+CSS.escape(id)) || svgEl.querySelector('[id="'+id+'"]');
    if(!g)return;
    g.classList.add('editable');
    g.dataset.pid=id;
    const t=readTransform(g);
    parts.push({id, el:g, x:t.x??0, y:t.y??0, rot:t.rot??0, sx:t.sx??1, sy:t.sy??1, base:centerOf(g)});
    bindPart(g,id);
  });
  renderList();
  status.textContent='已加载，可编辑部件 '+parts.length+' 个';
}

function centerOf(g){
  // 不含动态 transform 的几何中心（getBBox 受当前 transform 影响，用 screen→SVG 反算）
  const b=g.getBBox();
  return {x:b.x+b.width/2, y:b.y+b.height/2, w:b.width, h:b.height};
}
function readTransform(g){
  const tr=g.getAttribute('transform')||'';
  const o={x:0,y:0,rot:0,sx:1,sy:1,has:false};
  let m=tr.match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/); if(m){o.x=+m[1];o.y=+m[2];o.has=true;}
  m=tr.match(/rotate\(\s*([-\d.]+)/); if(m){o.rot=+m[1];o.has=true;}
  m=tr.match(/scale\(\s*([-\d.]+)(?:[ ,]+([-\d.]+))?\s*\)/); if(m){o.sx=+m[1];o.sy=+(m[2]||m[1]);o.has=true;}
  return o;
}
function applyTransform(p){
  // 在部件外包一个变换：直接写 transform（多数顶层部件原本无 transform，安全）
  let s='';
  if(p.x||p.y)s+=`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) `;
  if(p.rot)s+=`rotate(${p.rot.toFixed(1)}) `;
  if(p.sx!==1||p.sy!==1)s+=`scale(${p.sx.toFixed(3)} ${p.sy.toFixed(3)}) `;
  p.el.setAttribute('transform',s.trim());
}

function bindPart(g,id){
  g.addEventListener('pointerdown',ev=>{
    ev.stopPropagation();
    const pt=toSvg(ev);
    if(ev.shiftKey){
      // Shift+点击：切换加入/移出多选
      toggleSelect(id);
    }else{
      // 普通点击：点已在选区内则保留多选用于整体拖动，否则单选
      if(!isSel(id)) select(id);
    }
    // 拖动当前所有选中部件
    drag={
      sx:pt.x, sy:pt.y,
      moves:selParts().map(p=>({p,ox:p.x,oy:p.y})),
    };
    g.setPointerCapture(ev.pointerId);
  });
  // 滚轮：单个缩放/旋转；多选时作用于全部选中
  g.addEventListener('wheel',ev=>{
    ev.preventDefault();ev.stopPropagation();
    if(!isSel(id)) select(id);
    const targets=selParts();
    const k=ev.deltaY<0?1.05:1/1.05;
    targets.forEach(p=>{
      if(ev.shiftKey){p.rot=Math.round((p.rot+(ev.deltaY<0?5:-5))*10)/10;}
      else{p.sx=Math.min(4,Math.max(.3,p.sx*k));p.sy=p.sx;}
      applyTransform(p);
    });
    syncPanel();
  },{passive:false});
}

function part(id){return parts.find(x=>x.id===id);}
let drag=null, marqueeEl=null, cornerLayer=null, overlayEl=null;
// 统一坐标转换：屏幕(client) <-> SVG viewBox。getScreenCTM 已含 stage 的 translate/scale
function toSvg(ev){ return clientToSvg(ev.clientX, ev.clientY); }
function clientToSvg(cx, cy){
  const pt=svgEl.createSVGPoint();pt.x=cx;pt.y=cy;
  return pt.matrixTransform(svgEl.getScreenCTM().inverse());
}
function svgToClient(sx, sy){
  const pt=svgEl.createSVGPoint();pt.x=sx;pt.y=sy;
  const p=pt.matrixTransform(svgEl.getScreenCTM());
  const r=wrap.getBoundingClientRect();
  return {x:p.x-r.left, y:p.y-r.top};
}

// ===== 四角变形（屏幕 overlay 手柄，不受视图缩放影响，位置永不偏移）=====
function deformableRects(p){
  if(!p)return [];
  return [...p.el.querySelectorAll('rect')].filter(r=>r.getBBox().width>4);
}
// polygon（梯形管道等）：可逐顶点拖拽
function deformablePolygons(p){
  if(!p)return [];
  return [...p.el.querySelectorAll('polygon[data-pts]')];
}
function polyPts(poly){
  return (poly.getAttribute('data-pts')||poly.getAttribute('points')||'').trim().split(/[\s,]+/).map(Number);
}
function setPolyPts(poly, arr){
  poly.setAttribute('points', arr.map(v=>(+v).toFixed(1)).join(' '));
  poly.setAttribute('data-pts', arr.join(','));
}
function initCornerLayer(){ overlayEl=document.getElementById('overlay'); }
function hideCorners(){ if(overlayEl)overlayEl.innerHTML=''; }

// 取一个 SVG 元素在屏幕坐标(相对 wrap)的轴对齐包围盒
function clientBox(svgElTarget){
  const r=wrap.getBoundingClientRect();
  // 用 getBoundingClientRect（屏幕真实像素，含所有 transform/rotate/视图缩放）
  const b=svgElTarget.getBoundingClientRect();
  return {x:b.left-r.left, y:b.top-r.top, w:b.width, h:b.height};
}
function showCorners(){
  hideCorners();
  const ps=selParts();
  // 选中部件的 bbox 虚线框（一个或多个）
  ps.forEach(p=>{
    const b=clientBox(p.el);
    const d=document.createElement('div');d.className='bbox';
    d.style.left=b.x+'px';d.style.top=b.y+'px';d.style.width=b.w+'px';d.style.height=b.h+'px';
    overlayEl.appendChild(d);
  });
  // 仅单选时给组内每个 rect 四角手柄
  if(ps.length!==1)return;
  const p=ps[0];
  // polygon（梯形）逐顶点手柄
  deformablePolygons(p).forEach((poly,pi)=>{
    const arr=polyPts(poly);
    for(let vi=0; vi+1<arr.length; vi+=2){
      const sp=svgPointToClient(poly, arr[vi], arr[vi+1]);
      const h=document.createElement('div');
      h.className='handle frame';
      h.style.left=sp.x+'px';h.style.top=sp.y+'px';h.style.cursor='move';
      h.title='梯形顶点 '+(vi/2+1);
      h.addEventListener('pointerdown',ev=>{
        ev.stopPropagation();ev.preventDefault();
        drag={poly:true,pid:p.id,polyIdx:pi,vIdx:vi,
              orig:arr.slice(), pt0:clientToSvg(ev.clientX,ev.clientY)};
      });
      overlayEl.appendChild(h);
    }
  });
  deformableRects(p).forEach((r,idx)=>{
    const cls=idx===0?'frame':'bore';
    [['nw',-1,-1],['ne',1,-1],['se',1,1],['sw',-1,1]].forEach(([cn,hx,hy])=>{
      const sc=cornerClientPos(r,hx,hy);
      const h=document.createElement('div');
      h.className='handle '+cls;
      h.style.left=sc.x+'px';h.style.top=sc.y+'px';
      h.style.cursor=(cn==='nw'||cn==='se')?'nwse-resize':'nesw-resize';
      h.title=(idx===0?'门框 ':'内槽 ')+cn;
      h.addEventListener('pointerdown',ev=>{
        ev.stopPropagation();ev.preventDefault();
        const pt0=clientToSvg(ev.clientX,ev.clientY);
        drag={corner:true,pid:p.id,rectIdx:idx,sx:hx,sy:hy,
              orig:rectOrig(r),
              // rect 自身变换（rotate 中心/角度）
              xform:readRectXform(r), pt0};
      });
      overlayEl.appendChild(h);
    });
  });
}
// 角手柄屏幕位置：把 rect 本地四角经 getScreenCTM 映射（含 rotate + 视图变换）
function cornerClientPos(r,hx,hy){
  const pt=svgEl.createSVGPoint();
  // 本地坐标四角（rect 自带 translate/rotate 的 CTM 会正确把它转到屏幕）
  pt.x=+r.getAttribute('x')+(hx>0?+r.getAttribute('width'):0);
  pt.y=+r.getAttribute('y')+(hy>0?+r.getAttribute('height'):0);
  const sp=pt.matrixTransform(r.getScreenCTM());
  const wr=wrap.getBoundingClientRect();
  return {x:sp.x-wr.left,y:sp.y-wr.top};
}
function readRectXform(r){
  const tr=r.getAttribute('transform')||'';
  const m=tr.match(/rotate\(\s*([-\d.]+)(?:[ ,]+([-\d.]+)[ ,]+([-\d.]+))?/);
  return m?{ang:+m[1], cx:m[2]===undefined?0:+m[2], cy:m[3]===undefined?0:+m[3]}:{ang:0,cx:0,cy:0};
}
function rectOrig(r){
  return {x:+r.getAttribute('x'),y:+r.getAttribute('y'),w:+r.getAttribute('width'),h:+r.getAttribute('height')};
}
// polygon 顶点（本地坐标）→ 屏幕
function svgPointToClient(el,sx,sy){
  const pt=svgEl.createSVGPoint();pt.x=sx;pt.y=sy;
  const sp=pt.matrixTransform(el.getScreenCTM());
  const wr=wrap.getBoundingClientRect();
  return {x:sp.x-wr.left,y:sp.y-wr.top};
}
function polyMove(ev){
  const d=drag; if(!d)return;
  const p=part(d.pid); if(!p)return;
  const poly=deformablePolygons(p)[d.polyIdx]; if(!poly)return;
  const arr=polyPts(poly);
  const cur=clientToSvg(ev.clientX,ev.clientY);  // SVG 坐标
  // 换算到 polygon 父组本地坐标（组可能有 translate/rotate）
  let lx=cur.x, ly=cur.y;
  const parent=poly.parentNode;
  if(parent&&parent.getScreenCTM){
    const pt=svgEl.createSVGPoint();pt.x=cur.x;pt.y=cur.y;
    const q=pt.matrixTransform(parent.getScreenCTM().inverse());
    lx=q.x;ly=q.y;
  }
  arr[d.vIdx]=lx; arr[d.vIdx+1]=ly;
  setPolyPts(poly,arr);
  showCorners();
}
function cornerMove(ev){
  const d=drag; if(!d)return;
  const p=part(d.pid); if(!p)return;
  const r=deformableRects(p)[d.rectIdx]; if(!r)return;
  const o=d.orig, cur=clientToSvg(ev.clientX,ev.clientY);
  // 把鼠标位移换算进 rect 本地坐标（扣除其 rotate）
  const ang=d.xform.ang*Math.PI/180;
  let dx=cur.x-d.pt0.x, dy=cur.y-d.pt0.y;
  const c=Math.cos(-ang),s=Math.sin(-ang);
  const lx=dx*c-dy*s, ly=dx*s+dy*c;
  let {x,y,w,h}=o;
  if(d.sx>0)w=Math.max(8,o.w+lx); else {x=o.x+lx;w=Math.max(8,o.w-lx);}
  if(d.sy>0)h=Math.max(8,o.h+ly); else {y=o.y+ly;h=Math.max(8,o.h-ly);}
  r.setAttribute('x',x.toFixed(1));r.setAttribute('y',y.toFixed(1));
  r.setAttribute('width',w.toFixed(1));r.setAttribute('height',h.toFixed(1));
  showCorners();
}

// ===== 多选集合 =====
let selIds=new Set();
function isSel(id){return selIds.has(id);}
function selParts(){return parts.filter(p=>selIds.has(p.id));}
function refreshHighlight(){
  svgEl.querySelectorAll('.editable.sel').forEach(e=>e.classList.remove('sel'));
  selIds.forEach(id=>{const p=part(id);if(p)p.el.classList.add('sel');});
  showCorners();
}
function select(id){
  selIds=new Set(id?[id]:[]);
  refreshHighlight();syncPanel();renderList();
}
function selectMany(ids, additive=false){
  if(!additive) selIds=new Set();
  ids.forEach(i=>selIds.add(i));
  refreshHighlight();syncPanel();renderList();
}
function toggleSelect(id){
  if(selIds.has(id))selIds.delete(id);else selIds.add(id);
  refreshHighlight();syncPanel();renderList();
}
function selectAll(){ selectMany(parts.map(p=>p.id)); }

// ===== 拖动（支持批量）=====
wrap.addEventListener('pointermove',ev=>{
  if(!drag)return;
  if(drag.pan){ _panMove(ev); return; }
  if(drag.corner){ cornerMove(ev); return; }
  if(drag.poly){ polyMove(ev); return; }
  if(drag.moves){
    const pt=toSvg(ev), dx=pt.x-drag.sx, dy=pt.y-drag.sy;
    drag.moves.forEach(m=>{m.p.x=m.ox+dx;m.p.y=m.oy+dy;applyTransform(m.p);});
  } else if(drag.marquee){
    const cur=toSvg(ev);
    const x=Math.min(drag.x0,cur.x),y=Math.min(drag.y0,cur.y);
    const w=Math.abs(cur.x-drag.x0),h=Math.abs(cur.y-drag.y0);
    marqueeEl.setAttribute('x',x);marqueeEl.setAttribute('y',y);
    marqueeEl.setAttribute('width',w);marqueeEl.setAttribute('height',h);
    const hit=parts.filter(p=>{const c=curCenter(p);return c.x>=x&&c.x<=x+w&&c.y>=y&&c.y<=y+h;}).map(p=>p.id);
    selectMany(drag.base.concat(hit), true);
  }
  if(drag.moves){syncPanel();showCorners();}
});
wrap.addEventListener('pointerup',()=>{_panUp();drag=null;marqueeEl.style.display='none';});

// ===== 空白处：点击取消选择，拖拽框选（空格/中键时平移）=====
wrap.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('.editable')||ev.target.closest('#panel'))return;
  if(spaceDown||ev.button===1){ return; } // 交给 pan 监听
  const pt=toSvg(ev);
  if(!ev.shiftKey) select(null);
  marqueeEl.style.display='';
  marqueeEl.setAttribute('x',pt.x);marqueeEl.setAttribute('y',pt.y);
  marqueeEl.setAttribute('width',0);marqueeEl.setAttribute('height',0);
  drag={marquee:true,x0:pt.x,y0:pt.y,base:ev.shiftKey?[...selIds]:[]};
});

// 键盘：Delete 删除、Ctrl+A 全选、Esc 取消、方向键移动
document.addEventListener('keydown',ev=>{
  const tag=(ev.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(ev.key==='Escape'){select(null);}
  else if(ev.key==='a'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();selectAll();}
  else if(ev.key==='Delete'||ev.key==='Backspace'){deleteSelected();}
  else if(ev.key.startsWith('Arrow')){
    const ps=selParts();if(!ps.length)return;ev.preventDefault();
    const d=ev.shiftKey?10:1;
    const dx=ev.key==='ArrowLeft'?-d:ev.key==='ArrowRight'?d:0;
    const dy=ev.key==='ArrowUp'?-d:ev.key==='ArrowDown'?d:0;
    ps.forEach(p=>{p.x+=dx;p.y+=dy;applyTransform(p);});
    syncPanel();
  }
});

function deleteSelected(){
  const ps=selParts();if(!ps.length)return;
  ps.forEach(p=>p.el.remove());
  const ids=new Set(ps.map(p=>p.id));
  parts=parts.filter(p=>!ids.has(p.id));
  select(null);renderList();toast('已删除 '+ids.size+' 个部件');
}

function syncPanel(){
  const ps=selParts();
  const n=ps.length;
  document.getElementById('selName').textContent=n===0?'未选择':(n===1?ps[0].id:`已选 ${n} 个部件`);
  const single=n===1;
  ['inX','inY'].forEach(id=>document.getElementById(id).disabled=!single);
  document.getElementById('inRot').disabled=!n;
  document.getElementById('inSize').disabled=!n;
  document.getElementById('btnFront').disabled=!n;
  document.getElementById('btnReset').disabled=!n;
  document.getElementById('btnFront').textContent=n>1?`删除选中(${n})`:'删除部件';
  if(n===1){
    const p=ps[0],c=curCenter(p);
    document.getElementById('inX').value=Math.round(c.x);
    document.getElementById('inY').value=Math.round(c.y);
    document.getElementById('inRot').value=p.rot;
    document.getElementById('inSize').value=Math.round(p.sx*100);
  }
}
['inX','inY'].forEach(k=>document.getElementById(k).addEventListener('input',()=>{
  const ps=selParts();if(ps.length!==1)return;const p=ps[0],c=curCenter(p);
  p.x+=(+document.getElementById('inX').value)-c.x;
  p.y+=(+document.getElementById('inY').value)-c.y;
  applyTransform(p);
}));
document.getElementById('inRot').addEventListener('input',e=>{
  // 多选时每个部件各自设为相同角度（保持各自位置）
  const v=+e.target.value;selParts().forEach(p=>{p.rot=v;applyTransform(p);});
});
document.getElementById('inSize').addEventListener('input',e=>{
  const v=(+e.target.value)/100;selParts().forEach(p=>{p.sx=p.sy=v;applyTransform(p);});
});
document.getElementById('btnReset').onclick=()=>{selParts().forEach(p=>{p.x=p.y=p.rot=0;p.sx=p.sy=1;applyTransform(p);});syncPanel();};
document.getElementById('btnFront').onclick=()=>deleteSelected();

// 选中 SLIT 组：把内部门框 rect 转为可拖 4 顶点的 polygon 梯形
document.getElementById('btnToTrap').onclick=()=>{
  const ps=selParts();
  if(ps.length!==1){toast('请先选中一个 *_SLIT 管道组');return;}
  const p=ps[0];
  const rects=deformableRects(p);
  if(!rects.length){toast('该部件内没有可转换的 rect');return;}
  rects.forEach(r=>{
    const x=+r.getAttribute('x'),y=+r.getAttribute('y'),w=+r.getAttribute('width'),h=+r.getAttribute('height');
    // 只应用 rect 自身 transform（translate/rotate），结果是父组 PORTx_SLIT 的本地坐标；
    // 不能用 getCTM（会叠加父组 transform，polygon 放入后双重偏移）。
    const tr=r.getAttribute('transform')||'';
    const tm=tr.match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)/);
    const rm=tr.match(/rotate\(\s*([-\d.]+)/);
    const tx=tm?+tm[1]:0, ty=tm?+tm[2]:0, ang=(rm?+rm[1]:0)*Math.PI/180;
    const c=Math.cos(ang),s=Math.sin(ang);
    const conv=(lx,ly)=>{const x2=lx,y2=ly;return [tx+x2*c-y2*s, ty+x2*s+y2*c];};
    const corners=[conv(x,y),conv(x+w,y),conv(x+w,y+h),conv(x,y+h)];
    const poly=document.createElementNS(SVGNS,'polygon');
    poly.setAttribute('points',corners.map(q=>q.map(v=>(+v).toFixed(1)).join(',')).join(' '));
    poly.setAttribute('data-pts',corners.flat().join(','));
    poly.setAttribute('fill',r.getAttribute('fill')||'#0d1420');
    poly.setAttribute('stroke',r.getAttribute('stroke')||'#56606e');
    poly.setAttribute('stroke-width',r.getAttribute('stroke-width')||6);
    poly.setAttribute('stroke-linejoin','round');
    r.parentNode.insertBefore(poly,r);
    r.remove();
  });
  showCorners();toast('已转为梯形，拖动 4 个顶点改变形状（外端拉宽可包住 PORT）');
};

function curCenter(p){
  const b=p.el.getBBox();
  return {x:b.x+b.width/2,y:b.y+b.height/2};
}

function renderList(){
  const el=document.getElementById('partList');el.innerHTML='';
  parts.forEach(p=>{
    const d=document.createElement('div');d.className='pli'+(isSel(p.id)?' sel':'');
    d.innerHTML=`<span>${p.id}</span><span class="ty">${p.el.tagName.toLowerCase()}</span>`;
    d.onclick=ev=>{ if(ev.shiftKey)toggleSelect(p.id); else select(p.id); };
    el.appendChild(d);
  });
}

// ===== 新增部件 =====
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
  const ty=b.dataset.add;
  let id=document.getElementById('newId').value.trim()||(ty.toUpperCase()+'_'+addSeq++);
  if(svgEl.querySelector('#'+CSS.escape(id))){toast('id 已存在');return;}
  const g=document.createElementNS(SVGNS,'g');
  g.setAttribute('id',id);g.classList.add('editable');g.dataset.pid=id;
  const C=viewVB, cx=C.x+C.w/2, cy=C.y+C.h/2;
  if(ty==='circle'){const c=document.createElementNS(SVGNS,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',42);c.setAttribute('fill','#fff');c.setAttribute('stroke','#2f3a4a');c.setAttribute('stroke-width',2.5);g.appendChild(c);}
  if(ty==='ellipse'){const c=document.createElementNS(SVGNS,'ellipse');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('rx',52);c.setAttribute('ry',38);c.setAttribute('fill','#fff');c.setAttribute('stroke','#2f3a4a');c.setAttribute('stroke-width',2.5);g.appendChild(c);}
  if(ty==='rect'){const c=document.createElementNS(SVGNS,'rect');c.setAttribute('x',cx-45);c.setAttribute('y',cy-32);c.setAttribute('width',90);c.setAttribute('height',64);c.setAttribute('rx',8);c.setAttribute('fill','#e9edf3');c.setAttribute('stroke','#3a4250');c.setAttribute('stroke-width',2.5);g.appendChild(c);}
  if(ty==='pipe'){const c=document.createElementNS(SVGNS,'rect');c.setAttribute('x',cx);c.setAttribute('y',cy-30);c.setAttribute('width',90);c.setAttribute('height',60);c.setAttribute('rx',4);c.setAttribute('fill','#0d1420');c.setAttribute('stroke','#56606e');c.setAttribute('stroke-width',6);g.appendChild(c);}
  if(ty==='trapezoid'){
    // 梯形管道：内端窄(40)、外端宽(72)，长 90，4 顶点可拖
    const wIn=40,wOut=72,L=90,x=cx,y=cy;
    const pts=[[x,y-wIn/2],[x+L,y-wOut/2],[x+L,y+wOut/2],[x,y+wIn/2]];
    const c=document.createElementNS(SVGNS,'polygon');
    const ptsStr=pts.map(q=>q.join(',')).join(' ');
    c.setAttribute('points',ptsStr);c.setAttribute('data-pts',pts.flat().join(','));
    c.setAttribute('fill','#0d1420');c.setAttribute('stroke','#56606e');c.setAttribute('stroke-width',6);c.setAttribute('stroke-linejoin','round');
    g.appendChild(c);
  }
  // 标签
  const t=document.createElementNS(SVGNS,'text');t.setAttribute('x',cx);t.setAttribute('y',cy+4);t.setAttribute('text-anchor','middle');t.setAttribute('font-size',12);t.setAttribute('font-weight',700);t.setAttribute('fill','#1f2937');t.setAttribute('pointer-events','none');t.textContent=id;g.appendChild(t);
  svgEl.appendChild(g);
  const rd=readTransform(g);
  const p={id,el:g,x:0,y:0,rot:0,sx:1,sy:1,base:centerOf(g)};parts.push(p);bindPart(g,id);
  renderList();select(id);toast('已新增 '+id);
});

// ===== 视图平移/缩放 =====
let view={x:0,y:0,s:1};  // 画布平移(px)与缩放
function applyView(){
  stage.style.transform=`translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  showCorners();   // overlay 手柄在屏幕坐标，视图变化后重定位
}
function fit(){
  // 按主机台（排除面板/标题/图例等装饰）的实际包围盒居中缩放，
  // 这样面板移走或移到屏外时，机台始终在可视区正中。
  const MACHINE_RE=/^(CH_[ABC](|_SLIT|_run|_alarm|_unload)|PA(|_SLIT)|PORT[12](|_SLIT)|SMIF[12]|CST_P[12]|POD_P[12](|_LK)|DOOR_P[12]|MAP_P[12]|WAFER_|ARM_ZONE|ARM_ROBOT|gas_box|baseplate)$/;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,found=false;
  parts.forEach(p=>{
    if(!MACHINE_RE.test(p.id))return;
    const b=p.el.getBBox(); if(b.width<1)return;
    found=true;
    x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);
  });
  const aw=wrap.clientWidth-24, ah=wrap.clientHeight-24;
  let vx,vy,vw,vh;
  if(found && x1>x0){ vx=x0;vy=y0;vw=x1-x0;vh=y1-y0; }
  else { vx=viewVB.x;vy=viewVB.y;vw=viewVB.w;vh=viewVB.h; }
  const s=Math.min(aw/vw, ah/vh);
  view.s=s;
  view.x=(wrap.clientWidth-vw*s)/2-vx*s;
  view.y=(wrap.clientHeight-vh*s)/2-vy*s;
  scale=s; applyView();
}
document.getElementById('btnFit').onclick=fit;
new ResizeObserver(fit).observe(wrap);

// 滚轮在空白处=缩放视图（在部件上=缩放部件，已 stopPropagation）
wrap.addEventListener('wheel',ev=>{
  if(ev.target.closest('.editable'))return;
  ev.preventDefault();
  const k=ev.deltaY<0?1.1:1/1.1, ns=Math.min(4,Math.max(.2,view.s*k));
  // 以鼠标为锚缩放
  const r=wrap.getBoundingClientRect();
  const mx=ev.clientX-r.left, my=ev.clientY-r.top;
  view.x=mx-(mx-view.x)*(ns/view.s);
  view.y=my-(my-view.y)*(ns/view.s);
  view.s=ns; applyView();
},{passive:false});

// 空格按住 或 鼠标中键 = 拖动画布；平时空白拖拽=框选
let spaceDown=false;
document.addEventListener('keydown',e=>{ if(e.code==='Space'&&!/input|textarea|select/i.test(e.target.tagName)){spaceDown=true;wrap.style.cursor='grab';e.preventDefault();} });
document.addEventListener('keyup',e=>{ if(e.code==='Space'){spaceDown=false;wrap.style.cursor='';} });
wrap.addEventListener('pointerdown',ev=>{
  const panMode=spaceDown||ev.button===1;
  if(!panMode)return;
  if(ev.target.closest('.editable'))return;
  ev.preventDefault();
  drag={pan:true,sx:ev.clientX,sy:ev.clientY,ox:view.x,oy:view.y};
  wrap.style.cursor='grabbing';
});
function _panMove(ev){
  if(!drag||!drag.pan)return false;
  view.x=drag.ox+(ev.clientX-drag.sx); view.y=drag.oy+(ev.clientY-drag.sy);
  applyView(); return true;
}
function _panUp(){ if(drag&&drag.pan){wrap.style.cursor=spaceDown?'grab':'';} }

// ===== 视图缩放/平移（适应窗口）=====
function _fitUnused(){
  const aw=wrap.clientWidth-2, ah=wrap.clientHeight-2;
  const s=Math.min(aw/viewVB.w, ah/viewVB.h);
  scale=s;
  stage.style.transform=`translate(${(aw-viewVB.w*s)/2}px, ${(ah-viewVB.h*s)/2}px) scale(${s})`;
}

// 整体居中 = 重新按主机台包围盒居中视图（不改动部件坐标，安全）
document.getElementById('btnCenter').onclick=()=>{ fit(); toast('视图已按机台居中'); };

// ===== 导出 / 复制 =====
function serialize(){
  const clone=svgEl.cloneNode(true);
  clone.querySelectorAll('.editable').forEach(e=>e.classList.remove('editable','sel'));
  clone.setAttribute('xmlns',SVGNS);
  return new XMLSerializer().serializeToString(clone);
}
document.getElementById('btnExport').onclick=()=>{
  const blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+serialize()],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oxe-drm-topview.svg';a.click();
  toast('已导出 SVG —— 用它覆盖 models/user/oxe-drm-topview.svg 后告诉我');
};
document.getElementById('btnCopy').onclick=async()=>{
  try{await navigator.clipboard.writeText(serialize());toast('SVG 源码已复制');}catch(e){toast('复制失败，请用导出');}
};

load();
</script>
