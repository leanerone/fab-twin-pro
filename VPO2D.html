<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VPO 2D/3D Unified Dashboard</title>
    <style>
      :root {
        --bg: #e9eef3;
        --surface: #ffffff;
        --surface-2: #f7f9fb;
        --ink: #111827;
        --muted: #64748b;
        --line: #cbd5e1;
        --line-strong: #94a3b8;
        --accent: #0f766e;
        --accent-2: #2563eb;
        --idle: #9ca3af;
        --running: #16a34a;
        --hold: #d97706;
        --alarm: #dc2626;
        --maintenance: #2563eb;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        color: var(--ink);
        background: var(--bg);
        overflow: hidden;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      button,
      select {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
        min-width: 320px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.3;
      }

      .subtitle {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
        align-items: center;
      }

      .btn,
      .select {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: var(--surface);
      }

      .btn {
        padding: 0 11px;
        cursor: pointer;
        white-space: nowrap;
      }

      .btn:hover {
        border-color: var(--line-strong);
        background: var(--surface-2);
      }

      .btn.primary {
        color: #ffffff;
        border-color: var(--accent);
        background: var(--accent);
      }

      .btn.primary:hover {
        background: #0b625b;
      }

      .select {
        padding: 0 32px 0 10px;
      }

      .main {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        min-height: 0;
        padding: 12px;
        position: relative;
      }

      .main > .panel {
        min-height: 0;
      }

      body.embed-mode {
        background: transparent;
      }

      body.embed-mode .app {
        grid-template-rows: 1fr;
      }

      body.embed-mode .topbar,
      body.embed-mode .bottom,
      body.embed-mode .lot-overlay {
        display: none;
      }

      body.embed-mode .main {
        padding: 0;
        gap: 0;
        height: 100%;
      }

      body.embed-mode .panel {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      body.embed-mode .view-panel {
        height: 100%;
      }

      body.embed-mode .view-wrap {
        height: 100%;
        min-height: 0;
      }

      .view-tabs {
        display: inline-flex;
        gap: 8px;
        padding: 0 12px;
      }

      .view-tab {
        min-height: 34px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.78);
        cursor: pointer;
        transition:
          border-color 140ms ease,
          color 140ms ease,
          background 140ms ease,
          transform 140ms ease;
      }

      .view-tab:hover {
        border-color: var(--line-strong);
        color: var(--ink);
        transform: translateY(-1px);
      }

      .view-tab.active,
      .view-tab.is-active {
        border-color: rgba(37, 99, 235, 0.4);
        color: var(--accent-2);
        background: rgba(219, 234, 254, 0.8);
      }

      .view-panel.hidden {
        display: none;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: #f8fafc;
      }

      .panel-title strong {
        display: block;
        font-size: 14px;
        line-height: 1.2;
      }

      .panel-title span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: var(--surface);
        font-size: 12px;
        white-space: nowrap;
      }

      .view-wrap {
        position: relative;
        height: calc(100% - 45px);
        min-height: 280px;
        background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%);
      }

      #map2d,
      #stage2d,
      #stage3d,
      #stage3dSvg {
        width: 100%;
        height: 100%;
        display: block;
      }

      #map2d {
        background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%);
      }

      #stage2d {
        background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%);
      }

      #stage3d {
        background: linear-gradient(180deg, #f7fafc 0%, #e8eef5 100%);
        cursor: grab;
        position: absolute;
        inset: 0;
        z-index: 1;
      }

      #stage3dSvg {
        display: none;
      }

      .preview-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #f8fafc;
      }

      .view-tip {
        position: absolute;
        right: 10px;
        bottom: 10px;
        max-width: calc(100% - 20px);
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.9);
        font-size: 12px;
      }

      .legend {
        position: absolute;
        left: 10px;
        bottom: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: calc(100% - 20px);
      }

      .legend-item {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.92);
        font-size: 11px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--idle);
      }

      .lot-overlay {
        position: fixed;
        left: 24px;
        top: 150px;
        z-index: 50;
        display: grid;
        gap: 10px;
        pointer-events: none;
      }

      .lot-chip {
        pointer-events: auto;
        display: inline-flex;
        flex-direction: column;
        gap: 3px;
        align-items: flex-start;
        justify-self: start;
        min-width: 220px;
        max-width: min(360px, calc(100vw - 48px));
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 14px;
        color: #0f172a;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.24),
          0 4px 10px rgba(15, 23, 42, 0.04);
        cursor: pointer;
        transition:
          transform 140ms ease,
          border-color 140ms ease,
          background 140ms ease;
      }

      .lot-chip:hover,
      .lot-chip.active {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.38);
        background: rgba(255, 255, 255, 0.22);
      }

      .lot-chip .label {
        color: rgba(15, 23, 42, 0.52);
        font-size: 11px;
        line-height: 1.2;
        letter-spacing: 0.02em;
      }

      .lot-chip .value {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.06;
        letter-spacing: 0.01em;
        color: var(--accent-2);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
        overflow-wrap: anywhere;
      }

      .lot-popover {
        pointer-events: auto;
        min-width: 260px;
        max-width: min(420px, calc(100vw - 48px));
        padding: 12px 14px 14px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        border-radius: 16px;
        color: #0f172a;
        background: rgba(15, 23, 42, 0.56);
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 42px rgba(15, 23, 42, 0.26);
        transform-origin: top left;
        transition:
          opacity 140ms ease,
          transform 140ms ease;
      }

      .lot-popover.hidden {
        opacity: 0;
        transform: translateY(-4px) scale(0.98);
        pointer-events: none;
      }

      .lot-popover-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .lot-popover-head strong {
        color: #ffffff;
        font-size: 13px;
        line-height: 1.2;
      }

      .lot-popover-head span {
        color: rgba(226, 232, 240, 0.8);
        font-size: 11px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .detail-card {
        min-height: 70px;
        padding: 9px 10px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
      }

      .detail-card span {
        display: block;
        color: rgba(226, 232, 240, 0.76);
        font-size: 11px;
        line-height: 1.2;
      }

      .detail-card strong {
        display: block;
        margin-top: 5px;
        color: #ffffff;
        font-size: 17px;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .detail {
        min-height: 0;
        padding: 12px;
        overflow: auto;
      }

      .detail h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      .kv {
        display: grid;
        grid-template-columns: 104px 1fr;
        gap: 7px 10px;
        align-items: start;
        font-size: 12px;
        line-height: 1.4;
      }

      .kv .k {
        color: var(--muted);
      }

      .kv .v {
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      .binding-list {
        display: grid;
        gap: 7px;
        margin-top: 14px;
      }

      .binding-item {
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
        cursor: pointer;
        text-align: left;
      }

      .binding-item:hover,
      .binding-item.active {
        border-color: var(--accent-2);
        background: #eff6ff;
      }

      .binding-item strong,
      .binding-item span {
        display: block;
      }

      .binding-item strong {
        font-size: 12px;
      }

      .binding-item span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.3;
      }

      .bottom {
        display: grid;
        grid-template-columns: minmax(120px, 180px) 1fr minmax(160px, 260px);
        gap: 12px;
        align-items: center;
        padding: 10px 12px 12px;
        border-top: 1px solid var(--line);
        background: var(--surface);
      }

      .timeline-label {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .timeline-label strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
      }

      .timeline {
        display: grid;
        grid-template-columns: repeat(var(--count), minmax(38px, 1fr));
        gap: 8px;
        min-width: 0;
      }

      .tick {
        position: relative;
        min-width: 0;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
        cursor: pointer;
        overflow: hidden;
        text-align: left;
      }

      .tick::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 5px;
        background: var(--state-color, var(--idle));
      }

      .tick.active {
        border-color: var(--accent-2);
        box-shadow: inset 0 0 0 1px var(--accent-2);
        background: #eff6ff;
      }

      .tick strong,
      .tick span {
        display: block;
        margin-left: 11px;
        margin-right: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tick strong {
        margin-top: 6px;
        font-size: 11px;
        color: var(--ink);
      }

      .tick span {
        margin-top: 1px;
        font-size: 10px;
        color: var(--muted);
      }

      .load-status {
        justify-self: end;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
        text-align: right;
        overflow-wrap: anywhere;
      }

      .hotspot {
        transition:
          fill 160ms ease,
          stroke 160ms ease,
          opacity 160ms ease,
          stroke-width 160ms ease;
        cursor: pointer;
      }

      .hotspot-label {
        pointer-events: none;
        font-size: 18px;
        fill: #0f172a;
        paint-order: stroke;
        stroke: rgba(248, 250, 252, 0.9);
        stroke-width: 5px;
        stroke-linejoin: round;
      }

      .grid-line {
        stroke: #dbe5ef;
        stroke-width: 1;
      }

      .machine-outline {
        fill: none;
        stroke: #334155;
        stroke-width: 2;
        stroke-dasharray: 8 7;
        opacity: 0.42;
      }

      .machine-label {
        fill: #334155;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .detail-line {
        stroke: #64748b;
        stroke-width: 2;
        stroke-linecap: round;
        opacity: 0.72;
      }

      .small-detail {
        fill: #475569;
        stroke: #1f2937;
        stroke-width: 1;
      }

      .port-pin {
        fill: #f8fafc;
        stroke: #334155;
        stroke-width: 1;
      }

      @keyframes pulseStroke {
        0%,
        100% {
          stroke-opacity: 1;
        }

        50% {
          stroke-opacity: 0.25;
        }
      }

      .alarm-pulse {
        animation: pulseStroke 0.9s ease-in-out infinite;
      }

      @media (max-width: 1180px) {
        html,
        body {
          overflow: auto;
        }

        .app {
          min-height: 100%;
          height: auto;
        }

        .main {
          grid-template-columns: 1fr;
          grid-template-rows: 440px;
        }

        .lot-overlay {
          left: 12px;
          right: 12px;
          top: 96px;
        }

        .lot-chip,
        .lot-popover {
          max-width: calc(100vw - 24px);
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }

        .bottom {
          grid-template-columns: 1fr;
        }

        .load-status {
          justify-self: stretch;
          text-align: left;
        }
      }

      @media (max-width: 760px) {
        .topbar {
          grid-template-columns: 1fr;
        }

        .toolbar {
          justify-content: flex-start;
        }

        .main {
          grid-template-columns: 1fr;
          grid-template-rows: 420px;
        }

        .timeline {
          grid-template-columns: 1fr;
        }

        .tick {
          height: 38px;
        }
      }
    </style>
  </head>

          if (key.startsWith("DETACH_")) return "detach";

      function resolveFlowSequence(currentKey, index) {
        const inAttach = ATTACH_FLOW_SEQUENCE.includes(currentKey);
        const inDetach = DETACH_FLOW_SEQUENCE.includes(currentKey);
        if (inAttach && !inDetach) return ATTACH_FLOW_SEQUENCE;
        if (inDetach && !inAttach) return DETACH_FLOW_SEQUENCE;
        const flowType = inferFlowType(index);
        if (flowType === "attach") return ATTACH_FLOW_SEQUENCE;
        if (flowType === "detach") return DETACH_FLOW_SEQUENCE;

          stroke: isWaferPart ? "rgba(203, 213, 225, 0.52)" : "rgba(15, 23, 42, 0.2)",
          lineWidth: isWaferPart ? 1.2 : 0.85,
          glow: false,
        };
      }
      function drawModel3D() {
        const faces = [];
        const progress = currentPodProgress();
        [
          ...(model.parts || []).map((part) => partWithWaferPortMotion(part, progress)),
          ...accessoryParts3D(),
          ...podParts3D(),
        ].forEach((part) => {
          const highlight = partStyle(part.id);
          const isWaferPart = part.id.startsWith("wafer_");
          const partFaces = part.type === "cylinder" ? buildCylinderFaces(part) : buildBoxFaces(part);
          partFaces.forEach((face) => {
            const projected = face.map(project);
            let depth = projected.reduce((sum, p) => sum + p.z, 0) / projected.length;
            // 强制 Tag 及扫描波浪线始终在最前端渲染，解决被晶舟盒或外罩遮挡的问题
            if (part.id.startsWith("pod_motion_tag")) {
              depth += 10000;
            }
            faces.push({
              projected,
              depth,
              color: highlight.color || part.color || "#aaaaaa",
              stroke: highlight.stroke,
              lineWidth: highlight.lineWidth,
              glow: highlight.glow,
              isWaferPart,
            });
          });
        });
        faces.sort((a, b) => a.depth - b.depth);
        faces.forEach((face) => {
          const p0 = face.projected[0],
            p1 = face.projected[1],
            p2 = face.projected[2];
          const ux = p1.x - p0.x,
            uy = p1.y - p0.y;
          const vx = p2.x - p0.x,
            vy = p2.y - p0.y;
          const factor = ux * vy - uy * vx > 0 ? 1.06 : 0.82;
          ctx.save();
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          if (face.glow) {
            ctx.shadowColor = isAlarm(events[eventIndex] || {}) ? "rgba(220, 38, 38, 0.42)" : "rgba(37, 99, 235, 0.24)";
            ctx.shadowBlur = isAlarm(events[eventIndex] || {}) ? 18 : 10;
          }
          ctx.fillStyle = shadeColor(face.color, factor);
          ctx.strokeStyle = face.stroke;
          ctx.lineWidth = face.lineWidth;
          ctx.beginPath();
          ctx.moveTo(face.projected[0].x, face.projected[0].y);
          for (let i = 1; i < face.projected.length; i++) ctx.lineTo(face.projected[i].x, face.projected[i].y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          if (face.isWaferPart) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.24)";
            ctx.lineWidth = 0.7;
            ctx.stroke();
          }
          if (factor > 1 && !face.glow) {
            ctx.shadowBlur = 0;
            ctx.strokeStyle = face.isWaferPart ? "rgba(255, 255, 255, 0.34)" : "rgba(255, 255, 255, 0.28)";
            ctx.lineWidth = face.isWaferPart ? 0.95 : 0.75;
            ctx.stroke();
          }
          ctx.restore();
        });
      }
      function drawAccessoryLabels() {
        const panelLabelCenter = project({ x: 470, y: -236, z: 206 });
        const buttonCenter = { x: panelLabelCenter.x, y: panelLabelCenter.y - 18 };
        const confirmButtonCenter = { x: panelLabelCenter.x, y: panelLabelCenter.y + 18 };
        const mouseAnimation = currentLaptopUiAnimation();
        ctx.save();
        ctx.font = "bold 18px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("进站", buttonCenter.x, buttonCenter.y);
        ctx.fillText("确定", confirmButtonCenter.x, confirmButtonCenter.y);
        if (mouseAnimation.active) {
          const target = mouseAnimation.kind === "confirm" ? confirmButtonCenter : buttonCenter;
          const start = { x: target.x + 76, y: target.y - 72 };
          const end = { x: target.x + 12, y: target.y + 8 };
          const mouse = {
            x: lerpValue(start.x, end.x, mouseAnimation.cursorProgress),
            y: lerpValue(start.y, end.y, mouseAnimation.cursorProgress),
          };
          ctx.save();
          ctx.translate(mouse.x, mouse.y);
          ctx.rotate(-0.22);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, 28);
          ctx.lineTo(8, 21);
          ctx.lineTo(14, 36);
          ctx.lineTo(20, 33);
          ctx.lineTo(14, 18);
          ctx.lineTo(26, 18);
          ctx.closePath();
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "rgba(15, 23, 42, 0.45)";
          ctx.lineWidth = 2;
          ctx.fill();
          ctx.stroke();
          ctx.restore();
          if (mouseAnimation.clickStrength > 0) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.75 - mouseAnimation.clickStrength * 0.3})`;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(target.x, target.y, 16 + mouseAnimation.clickStrength * 14, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
      function scannerBarcodeTargetWorldPoint() {
        const Y_STAGE = -36;
        const Z_BOTTOM_DOWN = 148;
        const override = window.podOverride || {};
        const opPodY = override.active ? override.opPodY || 0 : 0;
        const opPodZ = override.active ? override.opPodZ || 0 : 0;
        const opWaferY = override.active ? override.opWaferY || 0 : 0;
        const opWaferZ = override.active ? override.opWaferZ || 0 : 0;
        const wY = Y_STAGE + opPodY + opWaferY;
        const wZ = Z_BOTTOM_DOWN + 109 + opPodZ + opWaferZ;
        const cassetteMidY = wY + 6;
        const cassetteTopZ = wZ + 166;
        return { x: 0, y: cassetteMidY + 18, z: cassetteTopZ + 7.1 };
      }
      function drawAccessoryEffects() {
        const scannerPose = currentScannerPose();
        if (!scannerPose.scanning) return;
        const origin = project(scannerPose.window);
        const target = project(scannerBarcodeTargetWorldPoint());
        const directionX = target.x - origin.x;
        const directionY = target.y - origin.y;
        const directionLength = Math.hypot(directionX, directionY) || 1;
        const unitX = directionX / directionLength;
        const unitY = directionY / directionLength;
        const normalX = -unitY;
        const normalY = unitX;
        const spread = 18 + scannerPose.scanStrength * 18;
        const alpha = 0.22 + scannerPose.scanStrength * 0.26;
        ctx.save();
        ctx.fillStyle = `rgba(239, 68, 68, ${alpha})`;
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(target.x + normalX * spread, target.y + normalY * spread);
        ctx.lineTo(target.x - normalX * spread, target.y - normalY * spread);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = `rgba(248, 113, 113, ${0.55 + scannerPose.scanStrength * 0.25})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(target.x, target.y, 24 + scannerPose.scanStrength * 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(254, 202, 202, ${0.42 + scannerPose.scanStrength * 0.28})`;
        ctx.setLineDash([7, 5]);
        ctx.beginPath();
        ctx.arc(target.x, target.y, 38 + scannerPose.scanStrength * 16, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
      function render3D() {
        ctx.clearRect(0, 0, els.stage3d.clientWidth, els.stage3d.clientHeight);
        drawGrid3D();
        drawPodPath3D();
        drawModel3D();
        drawAccessoryLabels();
        drawAccessoryEffects();
      }
      function resize3D() {
        const dpr = window.devicePixelRatio || 1;
        els.stage3d.width = Math.max(1, Math.floor(els.stage3d.clientWidth * dpr));
        els.stage3d.height = Math.max(1, Math.floor(els.stage3d.clientHeight * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render3D();
      }
      function updateAll(includeInspector = true) {
        syncPodMotionWithEvent();
        update2D();
        if (currentViewMode === "3d" && ctx) {
          render3D();
        }
        updateTimeline();
        if (includeInspector) updateInspector();
      }
      function nextEvent() {
        setEventIndex(eventIndex + 1);
      }
      function prevEvent() {
        setEventIndex(eventIndex - 1);
      }
      function stopPlay() {
        if (playTimer) clearInterval(playTimer);
        playTimer = null;
        els.playBtn.textContent = "\u64ad\u653e";
      }
      function togglePlay() {
        if (playTimer) {
          stopPlay();
          return;
        }
        els.playBtn.textContent = "\u6682\u505c";
        playTimer = setInterval(nextEvent, Number(els.speedSelect.value));
      }
      function resetView() {
        selectedBindingId = null;
        hoveredBindingId = null;
        updateAll();
      }
      function resetViewOrientation() {
        currentViewMode = "3d";
        const defaults = defaultView();
        view.yaw = defaults.yaw;
        view.pitch = defaults.pitch;
        view.panX = defaults.panX;
        view.panY = defaults.panY;
        if (ctx) render3D();
      }
      function updateStage3DCursor() {
        if (!els.stage3d) return;
        if (dragMode === "orbit") {
          els.stage3d.style.cursor = "grabbing";
          return;
        }
        els.stage3d.style.cursor = "grab";
      }
      function nudgeViewPan(deltaX, deltaY) {
        view.panX += deltaX;
        view.panY += deltaY;
        if (ctx) render3D();
      }
      function setActiveView(mode) {
        currentViewMode = mode === "3d" ? "3d" : "2d";
        els.stage2d.hidden = currentViewMode !== "2d";
        els.stage3d.hidden = currentViewMode !== "3d";
        els.view2dTab.classList.toggle("is-active", currentViewMode === "2d");
        els.view3dTab.classList.toggle("is-active", currentViewMode === "3d");
        els.viewTip.textContent =
          currentViewMode === "2d"
            ? "Manual FRONT VIEW 风格 / SVG 2D 前视图 / 点击热点联动高亮"
            : "保留原始轻量 3D 模型 / 左键拖拽旋转 / 滚轮缩放 / 方向键平移";
        if (currentViewMode === "3d" && ctx) {
          resize3D();
          render3D();
        } else {
          update2D();
        }
      }
      function initControls() {
        els.prevBtn.addEventListener("click", prevEvent);
        els.nextBtn.addEventListener("click", nextEvent);
        els.playBtn.addEventListener("click", togglePlay);
        els.podAttachBtn.addEventListener("click", () => triggerManualPodMotion("attach"));
        els.podDetachBtn.addEventListener("click", () => triggerManualPodMotion("detach"));
        els.resetViewBtn.addEventListener("click", resetView);
        els.speedSelect.addEventListener("change", () => {
          if (playTimer) {
            stopPlay();
            togglePlay();
          }
        });
        els.view2dTab.addEventListener("click", () => setActiveView("2d"));
        els.view3dTab.addEventListener("click", () => setActiveView("3d"));
        if (els.stage3d && ctx) {
          els.stage3d.addEventListener("mousedown", (event) => {
            dragMode = "orbit";
            lastX = event.clientX;
            lastY = event.clientY;
            updateStage3DCursor();
          });
          window.addEventListener("mousemove", (event) => {
            if (dragMode !== "orbit") return;
            const deltaX = event.clientX - lastX;
            const deltaY = event.clientY - lastY;
            lastX = event.clientX;
            lastY = event.clientY;
            view.yaw += deltaX * 0.008;
            view.pitch = Math.max(-1.3, Math.min(0.2, view.pitch + deltaY * 0.006));
            render3D();
          });
          window.addEventListener("mouseup", () => {
            if (!dragMode) return;
            dragMode = null;
            updateStage3DCursor();
          });
          els.stage3d.addEventListener("mouseleave", () => {
            if (!dragMode) updateStage3DCursor();
          });
          els.stage3d.addEventListener(
            "wheel",
            (event) => {
              event.preventDefault();
              const factor = event.deltaY > 0 ? 0.92 : 1.08;
              view.scale = Math.max(0.24, Math.min(1.16, view.scale * factor));
              render3D();
            },
            { passive: false },
          );
          window.addEventListener("keydown", (event) => {
            if (currentViewMode !== "3d") return;
            if (event.key === "ArrowLeft") {
              event.preventDefault();
              nudgeViewPan(-keyboardPanStep, 0);
            } else if (event.key === "ArrowRight") {
              event.preventDefault();
              nudgeViewPan(keyboardPanStep, 0);
            } else if (event.key === "ArrowUp") {
              event.preventDefault();
              nudgeViewPan(0, -keyboardPanStep);
            } else if (event.key === "ArrowDown") {
              event.preventDefault();
              nudgeViewPan(0, keyboardPanStep);
            }
          });
          window.addEventListener("resize", () => {
            if (currentViewMode === "3d") resize3D();
          });
          updateStage3DCursor();
        }
      }
      function renderLegend() {
        els.legend.innerHTML = "";
        ["Idle", "Running", "Hold", "Alarm", "Maintenance"].forEach((state) => {
          const item = document.createElement("span");
          item.className = "legend-item";
          item.innerHTML = `<span class="dot" style="background:${colorForState(state)}"></span>${state}`;
          els.legend.appendChild(item);
        });
      }
      function animate() {
        const transientActive = Boolean(
          isAlarm(events[eventIndex] || {}) ||
          podMotion.kind ||
          isAccessoryAnimationActive() ||
          (window.podOverride &&
            (window.podOverride.scanActive ||
              window.podOverride.signalActive ||
              Math.abs(window.podOverride.opPodY || 0) > 1 ||
              Math.abs(window.podOverride.opPodZ || 0) > 1 ||
              Math.abs(window.podOverride.opWaferY || 0) > 1 ||
              Math.abs(window.podOverride.opWaferZ || 0) > 1)),
        );
        if (transientActive || hadTransient2DAnimation) {
          update2D();
        }
        if (currentViewMode === "3d" && ctx && (transientActive || isAccessoryAnimationActive() || podMotion.kind)) {
          render3D();
        }
        hadTransient2DAnimation = transientActive;
        requestAnimationFrame(animate);
      }
      async function init() {
        const [eventsResult, hotspotsResult, mappingResult, modelResult] = await Promise.all([
          loadJson("./vpo_mock_events.json", fallbackEvents),
          loadJson("./vpo_2d_hotspots_template.json", fallbackHotspots),
          loadJson("./vpo_2d_3d_unified_mapping.json", fallbackMapping),
          loadJson("./vpo_light_3d_model_template.json", fallbackModel),
        ]);
        events = Array.isArray(eventsResult.data) ? eventsResult.data : fallbackEvents;
        hotspots = hotspotsResult.data || fallbackHotspots;
        mapping = mappingResult.data || fallbackMapping;
        model = enhanceModelForVisuals(modelResult.data || fallbackModel);
        const toolId = resolveToolId(events);
        const latestDbEvent = await loadLatestDbEvent(toolId);
        if (latestDbEvent) {
          const merged = mergeLatestEvent(events, latestDbEvent);
          events = merged.events;
          eventIndex = merged.index;
        } else if (events.length > 0) {
          eventIndex = events.length - 1;
        }
        els.partCount.textContent = `${(model.parts || []).length + accessoryParts3D().length} \u4e2a\u90e8\u4ef6`;
        if (latestDbEvent) {
          els.loadStatus.textContent = `\u5df2\u52a0\u8f7d ${toolId} \u6570\u636e\u5e93\u6700\u65b0\u4e8b\u4ef6\uff0c\u5df2\u6309 ${latestDbEvent.event_type || "-"} \u6267\u884c\u5f53\u524d\u753b\u9762`;
        } else {
          els.loadStatus.textContent = [eventsResult, hotspotsResult, mappingResult, modelResult].every(
            (item) => item.loaded,
          )
            ? "\u672a\u53d6\u5230\u6570\u636e\u5e93\u6700\u65b0\u4e8b\u4ef6\uff0c\u4f7f\u7528\u672c\u5730\u4e8b\u4ef6\u6d41\u6700\u65b0\u753b\u9762"
            : "\u672a\u53d6\u5230\u6570\u636e\u5e93\u6700\u65b0\u4e8b\u4ef6\uff0c\u4f7f\u7528 fallback \u6570\u636e";
        }
        renderLegend();
        draw2DBase();
        drawTimeline();
        if (ctx) resize3D();
        updateAll();
        initControls();
        setActiveView("2d");
        animate();
        // 绑定会话并连接 RV 网桥（与 index.html 一致）
        (async () => {
          activeToolId = toolId;
          activeSessionId = getOrCreateSessionId();
          const bindingResult = await bindSession(toolId);
          if (bindingResult && bindingResult.binding) {
            els.loadStatus.textContent = `\u5df2\u7ed1\u5b9a ${toolId} / \u4f1a\u8bdd ${activeSessionId}`;
            connectRVBridge(toolId, activeSessionId);
          } else {
            els.loadStatus.textContent = `\u5df2\u52a0\u8f7d ${toolId} \u672c\u5730\u753b\u9762\uff0c\u7b49\u5f85\u7f51\u6865\u7ed1\u5b9a`;
          }
        })();
        window.addEventListener("pagehide", unbindSession);
        window.addEventListener("beforeunload", unbindSession);
      }
      function connectRVBridge(toolId, sessionId) {
        // 开启SSE监听从 Python 网桥发来的 RV 实时事件
        if (rvSource) {
          rvSource.close();
        }
        const params = new URLSearchParams({ tool_id: toolId, session_id: sessionId });
        rvSource = new EventSource(`${RV_BRIDGE_BASE_URL}/events?${params.toString()}`);
        rvSource.onmessage = function (e) {
          try {
            const rvData = JSON.parse(e.data);
            console.log("[孪生前端接收RV]", rvData);
            if (rvData.event_type === "CONNECTED") {
              els.loadStatus.textContent = `\u5df2\u8fde\u63a5 ${toolId} \u5b9e\u65f6\u7f51\u6865!`;
              els.loadStatus.style.color = "var(--running)";
            } else {
              // 将来自后端的消息推入事件主队列
              events.push(rvData); // 拨动进度条到最新动作位置并触发 UI 渲染
              eventIndex = events.length - 1;
              drawTimeline(); // 重绘底部时间轴刻度
              updateAll(); // 播放事件：更新2D状态/报警特效、更新3D模型
            }
          } catch (err) {}
        };
        rvSource.onerror = function () {
          console.warn("RV 网桥未启动，继续使用本地预设流");
        };
      }
      init();
    </script>
  </body>
