# CI 合并门禁：PR 必须三道检查全绿才能合并
# 首跑如遇环境差异（依赖版本/系统差异），按报错微调即可；本地能过 CI 一般能过。
name: CI

on:
  pull_request:
    branches: [ver3]
  push:
    branches: [ver3]

jobs:
  backend-tests:
    name: 后端回归（锁文件 + 审计 + 纯单元测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装锁定依赖
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: 依赖一致性检查
        run: pip check
      - name: 已知漏洞审计
        run: pip-audit -r backend/requirements.txt
      - name: 运行回归测试（不依赖真实 Oracle）
        run: python -m pytest tests/test_ai_middleware_regressions.py tests/test_model_draft_validation.py tests/test_security_regressions.py tests/test_svg_motion_validator.py tests/test_ai_data_regressions.py -q
    # tests/pytest 会写真实 Oracle，仅本机受控环境或隔离数据库 nightly 执行，不纳入 PR 门禁

  frontend-build:
    name: 前端构建与审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 依赖漏洞审计
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: 构建
        working-directory: frontend
        run: npm run build

  svg-motion-contract:
    name: 六机台 SVG×Motion 契约校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 逐台校验（errors>0 即失败）
        run: |
          python models/svg_kit/validate.py models/user/podopener-2200.svg models/user/podopener-2200.motion.json
          python models/svg_kit/validate.py models/user/oxe-drm-topview.svg models/user/oxe-drm-topview.motion.json
          python models/svg_kit/validate.py models/user/amat_metsput.svg models/user/amat_metsput.json
          python models/svg_kit/validate.py models/user/lam2300-topview.svg models/user/lam2300-topview.motion.json
          python models/svg_kit/validate.py models/user/centris-sym3-topview.svg models/user/centris-sym3-topview.motion.json
          python models/svg_kit/validate.py models/user/tel-synapse-topview.svg models/user/tel-synapse-topview.motion.json
      - name: 校验器等级与退出码回归
        run: pip install pytest && python -m pytest tests/test_svg_motion_validator.py -q
