openapi: 3.0.3
info:
  title: FabTwin Pro AI 助手 - n8n 10 工具接口（Dify 侧调用）
  description: |
    所有接口均由 n8n workflow 提供。
    公共参数：
      - 所有请求都是 POST + application/json
      - 所有接口都支持 Query 参数 ?secret=YOUR_N8N_WEBHOOK_SECRET
    统一响应结构（application/json）：
      - ok: boolean（true=成功，false=失败）
      - answer: string（自然语言中文摘要，直接给用户看）
      - table_data: object|null（{headers:string[], rows:any[][]}）
      - jump_timestamp: string|null（格式 YYYY-MM-DD HH:mm:ss，供 FabTwin 跳转回放）
      - jump_machine_id: string|null（跳转到该机器详情页）
      - sources: [{type:"n8n", workflow:string, execution_id:string, ...其他字段}]
  version: "1.0.0"
servers:
  - url: "{{n8n_base_url}}/webhook"
    description: n8n webhook 根（由 Dify Start 节点变量传入）

paths:
  /get_machine_status:
    post:
      summary: F1 - 机台实时状态/运行模式/当前 Lot / 全厂概览
      operationId: get_machine_status
      parameters:
        - name: secret
          in: query
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                machine_id: { type: string, description: "机台ID（如 OXE-1），可空=全厂" }
      responses:
        '200': { $ref: '#/components/responses/Standard' }

  /get_lot_info:
    post:
      summary: F2 - Lot 位置/进度追踪（单 Lot 或机台 Lot 列表）
      operationId: get_lot_info
      parameters: [{ name: secret, in: query, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lot_id: { type: string, description: "Lot ID（5~15位字母数字，例如 V47Q6），可空" }
                machine_id: { type: string, description: "机台ID，可空" }
      responses: { '200': { $ref: '#/components/responses/Standard' } }

  /get_machine_alarms:
    post:
      summary: F3 - 报警统计/异常定位（按严重等级/时间范围）
      operationId: get_machine_alarms
      parameters: [{ name: secret, in: query, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                machine_id: { type: string, description: "机台ID，可空=全厂" }
                severity: { type: string, enum: [critical, warning, info, ""], description: "严重等级，空=全部" }
                days: { type: integer, description: "近 X 天，默认 7", default: 7 }
      responses: { '200': { $ref: '#/components/responses/Standard' } }

  /get_event_timeline:
    post:
      summary: F4 - 温度趋势/事件分布/时间线
      operationId: get_event_timeline
      parameters: [{ name: secret, in: query, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machine_id]
              properties:
                machine_id: { type: string, description: "机台ID，必填" }
                time_range: { type: string, enum: [today, yesterday, this_week, last_2h, last_7d, last_30d], default: today }
      responses: { '200': { $ref: '#/components/responses/Standard' } }

  /get_yield_stats:
    post:
      summary: F5 - 产量/Lot/晶圆统计（完成率）
      operationId: get_yield_stats
      parameters: [{ name: secret, in: query, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machine_id]
              properties:
                machine_id: { type: string, description: "机台ID，必填" }
                time_range: { type: string, enum: [today, yesterday, this_week, this_month], default: today }
      responses: { '200': { $ref: '#/components/responses/Standard' } }

  /get_recipe_info:
    post:
      summary: F6 - 工艺配方/Recipe 查询（机台必填）
      operationId: get_recipe_info
      parameters: [{ name: secret, in: query, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machine_id]
              properties:
                machine_id: { type: string, description: "机台ID，必填" }
      responses: { '200': { $ref: '#/components/responses/Standard' } }

  /get_mes_lot_info:
    post:
      summary: F7 - MES Lot 详情【管理员权限】（良率/路线/工序站/操作员...）
      operationId: get_mes_lot_info
      parameters: [{ name: secret, in: query, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lot_id]
              properties:
                lot_id: { type: string, description: "Lot ID（必填）" }
      responses: { '200': { $ref: '#/components/responses/Standard' } }

  /export_alarm_report:
    post:
      summary: F8 - 导出报警报表 Excel【管理员权限】
      operationId: export_alarm_report
      parameters: [{ name: secret, in: query, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                machine_id: { type: string, description: "机台ID，可空=全厂" }
                days: { type: integer, description: "近 X 天，默认 7", default: 7 }
      responses: { '200': { $ref: '#/components/responses/Standard' } }

  /generate_work_order:
    post:
      summary: F9 - 生成故障工单【管理员权限】
      operationId: generate_work_order
      parameters: [{ name: secret, in: query, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machine_id, fault_type]
              properties:
                machine_id: { type: string, description: "机台ID，必填" }
                fault_type: { type: string, description: "故障描述（例如 Chamber B RF 功率异常）" }
                severity: { type: string, enum: [low, medium, high], default: medium }
      responses: { '200': { $ref: '#/components/responses/Standard' } }

  /list_capabilities:
    post:
      summary: F10 - 功能清单（回答"你能帮我干什么"）
      operationId: list_capabilities
      parameters: [{ name: secret, in: query, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses: { '200': { $ref: '#/components/responses/Standard' } }

components:
  responses:
    Standard:
      description: 标准响应
      content:
        application/json:
          schema:
            type: object
            required: [ok, answer, table_data, jump_timestamp, jump_machine_id, sources]
            properties:
              ok: { type: boolean }
              answer: { type: string, description: "中文自然语言摘要，直接呈现给用户" }
              table_data:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [headers, rows]
                    properties:
                      headers: { type: array, items: { type: string } }
                      rows: { type: array, items: { type: array, items: {} } }
                    additionalProperties: false
              jump_timestamp: { type: [string, 'null'], description: "YYYY-MM-DD HH:mm:ss，用于 FabTwin 回放跳转" }
              jump_machine_id: { type: [string, 'null'], description: "跳转的机台 ID" }
              sources:
                type: array
                items:
                  type: object
                  required: [type, workflow, execution_id]
                  properties:
                    type: { type: string, enum: [n8n, tool] }
                    workflow: { type: string }
                    execution_id: { type: string }
                    download_url: { type: string }
                    size_kb: { type: integer }
                    row_count: { type: integer }
                    wo_id: { type: string }
                    wo_link: { type: string }
                    owner: { type: string }
