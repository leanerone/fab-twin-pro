        positionAbsolute: {x: 1848, y: 470}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243

      - data:
          desc: ''
          outputs:
            - {value_selector: ['1002', machine], variable: machine}
            - {value_selector: ['1002', date], variable: date}
            - {value_selector: ['1006', filename], variable: filename}
            - {value_selector: ['1008', reason], variable: reason}
          selected: false
          title: 失败-无有效下载链接
          type: end
