            - {value_selector: ['1002', date], variable: date}
            - {value_selector: ['1006', filename], variable: filename}
            - {value_selector: ['1006', file_count], variable: file_count}
            - {value_selector: ['1008', download_url], variable: download_url}
        height: 53
        id: '1014'
        position: {x: 2757, y: 254}
        positionAbsolute: {x: 2757, y: 254}
        selected: false
        sourcePosition: right
        targetPosition: left
