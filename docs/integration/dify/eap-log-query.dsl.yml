      - data:
          code: |
            import json

            BASE = 'http://10.30.8.243:8080'

            def main(machine, date, filename, file_count, download_url):
                full_url = BASE + download_url
                name = filename or 'download.log'

                # 只呈现图标 + 文件名，不暴露链接文字
                answer = (
                    '已找到 ' + machine + ' 在 ' + date + ' 的日志文件'
                    + '（当日共 ' + str(file_count) + ' 个）。\n\n'
                    + '| 机台 | 日期 | 文件 | 下载 |\n'
                    + '| --- | --- | --- | --- |\n'
                    + '| ' + machine + ' | ' + date + ' | 📄 ' + name
                    + ' | [⬇️](' + full_url + ') |'
                )

                block = {
                    'ok': True,
                    'answer': answer,
                    'table_data': {
                        'headers': ['机台', '日期', '文件名', '下载'],
                        'rows': [[machine, date, name, full_url]],
                    },
                    'sources': [{'type': 'eap', 'workflow': 'EAP Log Query'}],
                }

                return {
                    'ok': 'YES',
                    'answer': answer,
                    'filename': name,
                    'download_url': full_url,
                    'fabtwin_block': '<FABTWIN>' + json.dumps(block, ensure_ascii=False) + '</FABTWIN>',
                }
          code_language: python3
          desc: 生成图标式下载呈现与统一契约块
          outputs:
            answer: {children: null, type: string}
            download_url: {children: null, type: string}
            fabtwin_block: {children: null, type: string}
            filename: {children: null, type: string}
            ok: {children: null, type: string}
