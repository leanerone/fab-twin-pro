      - data:
          code: |
            import json
            from urllib.parse import urlparse, parse_qs

            BASE = 'http://10.30.8.243:8080'

            def main(machine, start_date, end_date, file_count, download_url):
                full_url = BASE + download_url

                try:
                    qs = urlparse(download_url).query
                    path = parse_qs(qs).get('path', [''])[0]
                    name = path.split('/')[-1] or 'batch.zip'
