            - {value_selector: ['1014', answer], variable: answer}
            - {value_selector: ['1002', machine], variable: machine}
            - {value_selector: ['1002', date], variable: date}
            - {value_selector: ['1014', filename], variable: filename}
            - {value_selector: ['1014', download_url], variable: download_url}
            - {value_selector: ['1014', fabtwin_block], variable: fabtwin_block}
          selected: false
