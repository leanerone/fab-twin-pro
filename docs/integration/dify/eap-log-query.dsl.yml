          timeout: {max_connect_timeout: 10, max_read_timeout: 60, max_write_timeout: 20}
          title: 查询文件列表
          type: http-request
          url: http://10.30.8.243:8080/api/ext/search?machine={{#1002.machine#}}&date={{#1002.start_date#}}&message_type={{#1002.message_type#}}
          variables: []
        height: 221
        id: '1003'
        position: {x: 939, y: 254}
        positionAbsolute: {x: 939, y: 254}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243

      - data:
          code: |
            import json

            def main(response_body):
                try:
                    data = json.loads(response_body)
                except Exception:
                    return {'has_files': 'NO', 'filename': '', 'file_count': '0',
                            'reason': '文件列表接口返回内容无法解析为 JSON'}

                files = data.get('files') or []
                if not files:
                    return {'has_files': 'NO', 'filename': '', 'file_count': '0',
                            'reason': '该机台/日期下没有匹配的日志文件'}

                name = (files[0].get('name') or '').strip()
                if not name:
                    return {'has_files': 'NO', 'filename': '', 'file_count': str(len(files)),
                            'reason': '文件列表存在但首条记录缺少 name 字段'}

                return {'has_files': 'YES', 'filename': name,
                        'file_count': str(len(files)), 'reason': ''}
          code_language: python3
          desc: 取首个文件并输出失败原因
          outputs:
            file_count: {children: null, type: string}
            filename: {children: null, type: string}
            has_files: {children: null, type: string}
            reason: {children: null, type: string}
          selected: false
          title: 解析文件列表
          type: code
          variables:
            - {value_selector: ['1003', body], variable: response_body}
