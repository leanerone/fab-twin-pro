    nodes:
      - data:
          desc: 日志查询入参。date 用于单日；start_date/end_date 不同则走批量打包。
          selected: false
          title: 开始
          type: start
          variables:
            - {label: machine, max_length: 40, options: [], required: true, type: text-input, variable: machine}
            - {label: date, max_length: 20, options: [], required: false, type: text-input, variable: date}
            - {label: start_date, max_length: 20, options: [], required: false, type: text-input, variable: start_date}
            - {label: end_date, max_length: 20, options: [], required: false, type: text-input, variable: end_date}
            - {label: message_type, max_length: 40, options: [], required: false, type: text-input, variable: message_type}
        height: 193
        id: '1001'
        position: {x: 30, y: 310}
        positionAbsolute: {x: 30, y: 310}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243

      - data:
          code: |
            def main(machine, date, start_date, end_date, message_type):
                machine = (machine or '').strip()
                if not machine:
                    raise ValueError('missing machine')

                sd = (start_date or date or '').strip()
                ed = (end_date or sd or '').strip()
                if not sd:
                    raise ValueError('date or start_date required')
                if ed < sd:
                    sd, ed = ed, sd

                return {
                    'machine': machine,
                    'date': str(sd),
                    'start_date': str(sd),
                    'end_date': str(ed),
                    'message_type': (message_type or '').strip(),
                    'is_batch': 'YES' if sd != ed else 'NO',
                }
          code_language: python3
          desc: 归一化入参并判定单日/批量
          outputs:
            date: {children: null, type: string}
            end_date: {children: null, type: string}
            is_batch: {children: null, type: string}
            machine: {children: null, type: string}
            message_type: {children: null, type: string}
            start_date: {children: null, type: string}
          selected: false
          title: 参数校验
          type: code
          variables:
            - {value_selector: ['1001', machine], variable: machine}
            - {value_selector: ['1001', date], variable: date}
            - {value_selector: ['1001', start_date], variable: start_date}
            - {value_selector: ['1001', end_date], variable: end_date}
            - {value_selector: ['1001', message_type], variable: message_type}
