          desc: 请求生成单文件下载链接
          headers: |-
            X-API-Key: change-ext-token
            Content-Type: application/json
          method: post
          params: ''
          retry_config: {max_retries: 2, retry_enabled: true, retry_interval: 200}
          selected: false
          timeout: {max_connect_timeout: 10, max_read_timeout: 120, max_write_timeout: 20}
          title: 请求抓取
          type: http-request
          url: http://10.30.8.243:8080/api/ext/fetch
          variables: []
        height: 134
        id: '1007'
        position: {x: 1848, y: 299}
        positionAbsolute: {x: 1848, y: 299}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243

      - data:
          code: |
            import json
            from urllib.parse import urlparse

            API_KEY = 'change-ext-token'

            def main(response_body):
                try:
                    data = json.loads(response_body)
                except Exception:
                    return {'download_url': '', 'reason': '抓取接口返回内容无法解析为 JSON'}

                url = (data.get('download_url') or '').strip()
                if not url:
                    return {'download_url': '', 'reason': '抓取接口未返回 download_url'}

                # 服务端可能返回绝对地址，剥成相对路径，避免与前缀重复拼接
                if url.startswith('http://') or url.startswith('https://'):
                    p = urlparse(url)
                    url = p.path + (('?' + p.query) if p.query else '')

                if not url.startswith('/api/'):
                    return {'download_url': '', 'reason': '下载链接格式异常: ' + url[:80]}

                # 兜底补鉴权参数，避免仅依赖 Header
                if 'api_key=' not in url:
                    url += ('&' if '?' in url else '?') + 'api_key=' + API_KEY

                return {'download_url': url, 'reason': ''}
          code_language: python3
          desc: 归一化下载链接并补 api_key
          outputs:
            download_url: {children: null, type: string}
            reason: {children: null, type: string}
          selected: false
          title: 提取下载链接
          type: code
          variables:
            - {value_selector: ['1007', body], variable: response_body}
