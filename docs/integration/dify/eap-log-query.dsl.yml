        positionAbsolute: {x: 2757, y: 440}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243

      - data:
          authorization: {config: null, type: no-auth}
          body:
            data:
              - id: b1
                key: ''
                type: text
                value: '{"machine": "{{#1002.machine#}}", "start_date": "{{#1002.start_date#}}", "end_date": "{{#1002.end_date#}}", "message_type": "{{#1002.message_type#}}"}'
            type: raw-text
          desc: 同步打包，读超时放宽到 180s
          headers: |-
            X-API-Key: change-ext-token
            Content-Type: application/json
          method: post
          params: ''
          retry_config: {max_retries: 1, retry_enabled: true, retry_interval: 1000}
          selected: false
          timeout: {max_connect_timeout: 10, max_read_timeout: 180, max_write_timeout: 30}
          title: 批量查询打包
          type: http-request
          url: http://10.30.8.243:8080/api/ext/bundle_batch_sync
          variables: []
        height: 109
        id: '1021'
        position: {x: 939, y: 776}
        positionAbsolute: {x: 939, y: 776}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243

      - data:
          code: |
            import json
            from urllib.parse import urlparse

            API_KEY = 'change-ext-token'

            def main(response_body):
                try:
                    data = json.loads(response_body)
                except Exception:
                    return {'has_files': 'NO', 'download_url': '', 'file_count': '0',
                            'reason': '批量打包接口返回内容无法解析为 JSON'}

                status = data.get('status')
                if status != 'done':
                    return {'has_files': 'NO', 'download_url': '', 'file_count': '0',
                            'reason': '批量打包未完成，status=' + str(status)}

                url = (data.get('download_url') or '').strip()
                if not url:
                    return {'has_files': 'NO', 'download_url': '', 'file_count': '0',
                            'reason': '批量打包已完成但未返回 download_url'}

                if url.startswith('http://') or url.startswith('https://'):
                    p = urlparse(url)
                    url = p.path + (('?' + p.query) if p.query else '')

                if not url.startswith('/api/'):
                    return {'has_files': 'NO', 'download_url': '', 'file_count': '0',
                            'reason': '批量下载链接格式异常: ' + url[:80]}

                # 关键修复：批量链接服务端未带 api_key，此处兜底补上
                if 'api_key=' not in url:
                    url += ('&' if '?' in url else '?') + 'api_key=' + API_KEY

                count = data.get('file_count') or data.get('count') or 0

                return {'has_files': 'YES', 'download_url': url,
                        'file_count': str(count), 'reason': ''}
          code_language: python3
          desc: 归一化批量链接并补 api_key
          outputs:
            download_url: {children: null, type: string}
            file_count: {children: null, type: string}
            has_files: {children: null, type: string}
            reason: {children: null, type: string}
          selected: false
          title: 提取批打包链接
          type: code
          variables:
