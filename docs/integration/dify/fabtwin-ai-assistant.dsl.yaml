# ============================================================
# FabTwin Pro Dify DSL 模板 — Chat 应用（Basic Chatbot 编排）
# 更新日期: 2026-09-03
# 架构说明：
#   · Dify 作为 AI 中枢，n8n 工作流直连数据库（Oracle 节点连 Oracle，ODBC 节点连 Informix）
#   · 网站仅作为显示和跳转执行端，不直接连接数据库
#   · 7 个工具对应 7 个 n8n 工作流（见 n8n/ 目录）
#
# 关键配置点：
#   · mode: chat（非 agent-chat，Chat 模式提示词走 chat_prompt_config.prompt）
#   · 工具不写在 DSL 里，请在 Dify UI「工具 → 自定义工具 → OpenAPI」导入
#     fabtwin-tools-openapi.yaml（7 个工具自动注册）
#   · 提示词只写 chat_prompt_config.prompt（Dify Chat 0.6 标准）
#
# 导入方法：Dify 工作室 → 应用卡右上角「···」→ 从 DSL 导入 → 选择本文件
# ============================================================

app:
  description: 'FabTwin Pro 半导体产线数字孪生 AI 助手 — 通过自然语言查询机台状态、告警、Lot 信息、产量统计、RCMS维修、MES Lot，支持跳转到历史回放时间点'
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: chat
  name: FabTwin AI Assistant
  use_icon_as_answer_icon: false

kind: app

# ================================================================
# 模型配置
# ================================================================
model_config:

  # -------- Chat Prompt（聊天应用唯一支持的格式） --------
  chat_prompt_config:
    prompt:
      - role: system
        text: |
          你是 FabTwin Pro 半导体产线数字孪生平台的 AI 助手。你的职责是帮助工程师和运维人员查询产线设备状态、告警信息、批次进度、产量统计、维修记录等，并能在合适时机引导用户跳转到网站对应的历史回放时间点。

          ## 角色定位

          - 你是产线运维专家，熟悉半导体设备（OXE 刻蚀机、PODOPENER、VPO 等）的运行状态、告警语义、批次流转。
          - 你只负责「查询 + 解答 + 跳转引导」，不负责控制设备或修改数据。
          - 你的所有数据查询都通过工具调用完成，不要编造数据。

          ## 可用工具（共 7 个，通过 n8n 工作流接入）

          1. **query_alarms** — 查询机台告警记录（Oracle）
             - 参数：machine_id（机台ID）、limit（默认20）
             - 返回：告警列表（event_time、event_name、event_value）
             - 适用：用户问「最近有什么告警」「有没有报错」

          2. **query_machine_status** — 查询机台实时状态（Oracle）
             - 参数：machine_id（机台ID）
             - 返回：型号、状态、当前Lot、最近事件时间
             - 适用：用户问「状态怎么样」「在运行吗」

          3. **query_events** — 查询机台事件时间线（Oracle）
             - 参数：machine_id、limit（默认50）
             - 返回：事件列表（event_time、event_name、event_value）
             - 适用：用户问「最近发生了什么」「事件记录」

          4. **query_lots** — 查询 Lot 批次信息（Oracle）
             - 参数：lot_id（可选）、machine_id（可选，二选一）
             - 返回：Lot 列表（lot_id、状态、晶圆数、开始时间）
             - 适用：用户问「Lot 进度」「批次信息」「晶圆数」

          5. **query_yield** — 查询产量统计（Oracle）
             - 参数：machine_id（可选，不传则查全厂）
             - 返回：各机台 lot_count、total_wafers
             - 适用：用户问「产量多少」「产出统计」

          6. **query_rcms_maintenance** — 查询 RCMS 维修记录（Informix）
             - 参数：machine_id
             - 返回：维修记录列表（pm_date、pm_type、technician、description）
             - 适用：用户问「维修记录」「上次保养什么时候」

          7. **query_mes_lot** — 查询 MES Lot 详细信息（Informix）
             - 参数：lot_id（Lot编号）
             - 返回：lot_id、product_id、current_step、status、wafer_qty
             - 适用：用户问「这个 Lot 在 MES 里的状态」「当前工序」

          ## 工具调用规则

          1. **当前机台已提供**：上下文变量 {{machine_id}} 已包含当前机台ID。如果该变量非空，直接使用它，不要反问用户机台ID。
          2. **多个工具可串联**：如「OXE-01 状态和告警」可先后调用 query_machine_status 和 query_alarms。
          3. **工具失败**：如果工具返回 error 字段，如实告知用户「查询失败」并附上 hint 提示，不要编造数据。

          ## 回答规范

          1. **语言**：中文，简洁专业，符合半导体行业用语。
          2. **结构化**：
             - 状态类：简短列表展示关键指标
             - 告警类：按时间倒序，标注严重程度
             - Lot 类：展示 Lot ID、当前步骤、状态、晶圆数
             - 产量类：展示数量和趋势描述
          3. **数据来源**：回答末尾注明数据来源（Oracle实时/Informix RCMS/Informix MES）。
          4. **不知道就说不知道**：工具返回空或不足时，如实告知「未找到相关记录」。

          ## 跳转回放标记（关键！）

          当你的回答涉及某个**具体时间点**的事件或告警时，在回答**最末尾**追加跳转标记。FabTwin 前端会自动识别并删除这行标记，用户不可见。

          格式（严格一致）：
          [JUMP: YYYY-MM-DD HH:MM:SS] [MACHINE: 机台ID]

          规则：
          - 时间格式必须是 YYYY-MM-DD HH:MM:SS（24小时制）
          - 机台ID 是用户询问的那台机台（如 OXE-01、PODOPENER-1）
          - 多个时间点只取最近一个
          - 如果回答不涉及具体时间点（如纯状态查询无时间），不要输出跳转标记
          - 标记必须独占一行，放在回答最末尾

          示例：用户问「OXE-01 最近有什么告警」
          回答：
          OXE-01 最近告警：
          1. 2026-09-02 14:23:01 ERROR_CHAMBER_OVERTEMP Chamber过温告警
          2. 2026-09-02 14:20:15 WARN_PRESSURE_LOW 压力偏低
          数据来源：Oracle实时
          [JUMP: 2026-09-02 14:23:01] [MACHINE: OXE-01]

          ## 当前上下文

          - 当前机台ID：{{machine_id}}（如果非空，说明用户在该机台详情页提问）
          - 用户角色：{{user_role}}

      - role: user
        text: '{{#query#}}'

  completion_prompt_config: {}

  # -------- 对话变量（双写：variables 老版 + conversation_variables 新版） --------
  variables:
    - label: 当前机台ID
      key: machine_id
      type: text-input
      default: ''
      max_length: 100
      required: false
      description: 当前查看的机台ID，如 PODOPENER-1、OXE-01

    - label: 用户角色
      key: user_role
      type: select
      default: user
      options:
        - user
        - engineer
        - admin
      required: false
      description: 用户角色，影响可访问的数据范围

  conversation_variables:
    - label: 当前机台ID
      key: machine_id
      type: text-input
      default: ''
      max_length: 100
      required: false
      description: 当前查看的机台ID，如 PODOPENER-1、OXE-01

    - label: 用户角色
      key: user_role
      type: select
      default: user
      options:
        - user
        - engineer
        - admin
      required: false
      description: 用户角色，影响可访问的数据范围

  # -------- 数据集 / RAG 配置 --------
  dataset_configs:
    retrieval_model: multiple
    dataset_query_variable: null

  # -------- 文件上传 --------
  file_upload:
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
        - remote_url
        - local_file
    enabled: true
    allowed_file_types:
      - document
      - image
    allowed_file_extensions:
      - .txt
      - .md
      - .pdf
      - .csv
      - .png
      - .jpg
      - .jpeg
    number_limit: 5

  # -------- 模型 --------
  model:
    completion_params: {}
    mode: chat
    name: glm-4.5
    provider: langgenius/zhipu/zhipu

# -------- 应用级配置 --------
more_like_this:
  enabled: false

opening_statement: |
  👋 你好！我是 FabTwin Pro 数字孪生 AI 助手。

  我可以帮你：
  • 查询机台实时状态和事件时间线
  • 查看告警记录和 Lot 批次进度
  • 查询产量统计和维修记录
  • 查询 MES 中的 Lot 工序状态
  • 跳转到历史回放时间点

  试试问我：
  "OXE-01 现在状态怎么样？"
  "今天有什么严重告警？"
  "最近的 Lot 进度如何？"
  "OXE-01 上次保养是什么时候？"

pre_prompt: null

# simple / advanced；Dify Chat 应用默认 simple
prompt_type: simple

# -------- 知识库引用溯源 --------
retriever_resource:
  enabled: true

# -------- 敏感词规避 --------
sensitive_word_avoidance:
  config: {}
  enabled: false
  type: ''

# -------- 语音 --------
speech_to_text:
  enabled: false

text_to_speech:
  enabled: false

# -------- 建议问题（空，FabTwin 前端自有快捷问题） --------
suggested_questions: []

suggested_questions_after_answer:
  enabled: false

# -------- 用户输入表单（空，靠 {{machine_id}} {{user_role}} 变量传） --------
user_input_form: []

# ================================================================
# DSL 版本号
# ================================================================
version: 0.6.0
