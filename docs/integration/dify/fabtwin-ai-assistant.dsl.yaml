app:
  description: FabTwin Pro 半导体产线数字孪生 AI 助手 - 通过自然语言查询机台状态、告警、Lot 信息、产量统计，并可跳转到历史回放
  icon: 🤖
  icon_background: '#1a1f2e'
  mode: chat
  name: FabTwin AI Assistant

kind: app
version: 0.6.0

# ========================================
# Dify 应用配置 - 可直接导入 Dify 0.6+
# 导入方法：Dify 工作室 → 创建应用 → 导入 DSL → 选择本文件
# ========================================

# ---------- 系统提示词 ----------
model_config:
  model:
    provider: openai
    name: gpt-4o-mini
    mode: chat
    completion_params:
      temperature: 0.3
      max_tokens: 2048

  prompt_template:
    - role: system
      text: |
        你是 FabTwin Pro 半导体产线数字孪生平台的 AI 助手。你的职责是帮助工程师和运维人员查询产线设备状态、告警信息、批次进度、产量统计等。

        ## 可用工具

        你有以下工具可用，请根据用户问题选择合适的工具调用：

        1. **get_machine_status** - 查询机台实时状态
           - 输入：machine_id（可选，不传则查询全厂）
           - 返回：最新事件、运行模式、当前Lot、机台列表

        2. **get_machine_alarms** - 查询机台告警记录
           - 输入：machine_id（可选）、limit（默认20）
           - 返回：告警列表（alarm_code、description、timestamp、level）

        3. **get_event_timeline** - 查询机台事件时间线
           - 输入：machine_id（可选）、limit（默认20）
           - 返回：事件类型分布、运行模式分布、最近事件列表

        4. **get_yield_stats** - 查询产量统计
           - 输入：machine_id（可选）
           - 返回：Lot数量、晶圆总数、完成率、产出统计

        5. **get_lot_info** - 查询Lot批次信息
           - 输入：lot_id（可选）、machine_id（可选）
           - 返回：Lot详细信息、当前状态、工艺步骤

        6. **get_recipe_info** - 查询工艺配方
           - 输入：machine_id（可选）
           - 返回：温度、压力、RF功率、气体流量、工艺时间

        ## 回答规范

        1. **先思考再行动**：先分析用户问题，判断是否需要调用工具，再决定调用哪个工具。
        2. **结构化回答**：
           - 状态类问题：用表格展示关键指标
           - 告警类问题：按等级分类，高亮严重告警
           - Lot类问题：展示 Lot ID、当前步骤、预计完成时间
           - 产量类问题：展示完成率、数量、趋势描述
        3. **跳转回放**：如果用户询问某个时间点的事件或告警，在回答末尾附上「跳转回放」按钮，格式为：
           `JUMP_TIMESTAMP:YYYY-MM-DD HH:MM:SS`
           `JUMP_MACHINE_ID:机台ID`
        4. **数据来源**：每次回答末尾注明数据来源（实时/历史）。
        5. **不知道就说不知道**：如果工具返回的数据不足以回答问题，如实告知用户。

        ## 当前上下文

        - 当前机台：{{machine_id}}
        - 用户角色：{{user_role}}

        请用中文回答，语言简洁专业，符合半导体行业用语习惯。

  # ---------- 变量定义 ----------
  variables:
    - label: 当前机台ID
      key: machine_id
      type: text-input
      default: ''
      max_length: 100
      required: false
      description: 当前查看的机台ID，如 PODOPENER-1

    - label: 用户角色
      key: user_role
      type: select
      default: user
      options:
        - user
        - engineer
        - admin
      required: false
      description: 用户角色，影响可访问的数据范围

  # ---------- 工具配置 ----------
  tools:
    - provider_id: custom
      provider_type: api
      tool_name: get_machine_status
      description: 查询机台实时状态，包括最新事件、运行模式、当前Lot。不传machine_id则返回全厂概览。

    - provider_id: custom
      provider_type: api
      tool_name: get_machine_alarms
      description: 查询机台告警记录，从事件流中提取alarm_code非空的事件。不传machine_id则查询全厂。

    - provider_id: custom
      provider_type: api
      tool_name: get_event_timeline
      description: 查询机台事件时间线，包括事件类型分布和运行模式分布。

    - provider_id: custom
      provider_type: api
      tool_name: get_yield_stats
      description: 查询产量统计，包括Lot数量、晶圆总数、完成率。

    - provider_id: custom
      provider_type: api
      tool_name: get_lot_info
      description: 查询Lot批次信息。可按lot_id查询单个批次，或按machine_id列出该机台最近的Lot。

    - provider_id: custom
      provider_type: api
      tool_name: get_recipe_info
      description: 查询工艺配方，包括温度、压力、RF功率、气体流量、工艺时间。

# ---------- 开场白 ----------
opening_statement: |
  👋 你好！我是 FabTwin Pro 数字孪生 AI 助手。

  我可以帮你：
  • 查询机台实时状态和运行模式
  • 查看告警记录和事件时间线
  • 查询 Lot 批次进度和产量统计
  • 了解工艺配方参数
  • 跳转到历史回放时间点

  试试问我：
  "PODOPENER-1 现在状态怎么样？"
  "今天有什么告警？"
  "最近的 Lot 进度如何？"

suggested_questions:
  - PODOPENER-1 现在状态怎么样？
  - 今天有什么告警？
  - 最近的 Lot 进度如何？
  - 产量统计数据

# ---------- 语速与回复 ----------
speech_to_text:
  enabled: false

text_to_speech:
  enabled: false
  voice: default

# ---------- 引用与溯源 ----------
retriever_resource:
  enabled: false

# ---------- 标注 ----------
annotation:
  enabled: false

# ---------- 文件上传 ----------
file_upload:
  enabled: true
  allowed_file_types:
    - document
    - image
    - audio
  allowed_file_extensions:
    - .txt
    - .md
    - .pdf
    - .csv
    - .png
    - .jpg
    - .jpeg
  number_limit: 5
