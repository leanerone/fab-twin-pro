# ============================================================
# FabTwin Pro Dify DSL 模板 — Chat 应用（Basic Chatbot 编排）
# 格式依据：用户 Dify 环境实际导入截图结果（非 Agent 模式，否则提示词/工具为空）
# 关键变更：
#   · mode: chat（不是 agent-chat，Agent 模式提示词走 agent_mode.prompt 且必须 Function Calling tools[] 格式）
#   · 删除 dependencies / agent_mode / annotation_reply / external_data_tools
#       └─ Agent 专属字段；在 Chat 模式下这些字段一旦存在 Dify 导入校验器会丢弃全部 prompt 和变量
#   · 提示词只写 chat_prompt_config.prompt（Dify Chat 0.6 标准），不写老版 prompt_template
#       └─ 双写会触发 Dify 导入校验器丢弃整个 prompt，导致导入后提示词为空（用户实测问题）
#   · 对话变量顶层写 variables + conversation_variables 双写
#   · 工具不写在 DSL 里，Chat 模式下请在 Dify UI「工具 → 添加工具 → OpenAPI / API 扩展」手动接入
# 导入方法：Dify 工作室 → 应用卡右上角「···」→ 从 DSL 导入 → 选择本文件
# ============================================================

app:
  description: 'FabTwin Pro 半导体产线数字孪生 AI 助手 — 通过自然语言查询机台状态、告警、Lot 信息、产量统计，支持跳转到历史回放时间点'
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: chat            # 关键：Chat 应用（Basic Chatbot 编排），不是 agent-chat！
  name: FabTwin AI Assistant
  use_icon_as_answer_icon: false

kind: app

# ================================================================
# 模型配置
# ================================================================
model_config:

  # -------- Chat Prompt（聊天应用唯一支持的格式） --------
  # 只写 chat_prompt_config.prompt（Dify Chat 0.6 标准格式）。
  # ⚠️ 不要同时写 prompt_template（老版 0.4/0.5）——双写会触发 Dify 导入校验器
  #    丢弃整个 prompt，导致导入后提示词为空（用户实测问题）。
  chat_prompt_config:
    prompt:
      - role: system
        text: |
          你是 FabTwin Pro 半导体产线数字孪生平台的 AI 助手。你的职责是帮助工程师和运维人员查询产线设备状态、告警信息、批次进度、产量统计等。

          ## 可用工具

          你有以下工具可用，请根据用户问题选择合适的工具调用：

          1. **get_machine_status** - 查询机台实时状态
             - 输入：machine_id（可选，不传则查询全厂）
             - 返回：最新事件、运行模式、当前Lot、机台列表

          2. **get_machine_alarms** - 查询机台告警记录
             - 输入：machine_id（可选）、limit（默认20）
             - 返回：告警列表（alarm_code、description、timestamp、level）

          3. **get_event_timeline** - 查询机台事件时间线
             - 输入：machine_id（可选）、limit（默认20）
             - 返回：事件类型分布、运行模式分布、最近事件列表

          4. **get_yield_stats** - 查询产量统计
             - 输入：machine_id（可选）
             - 返回：Lot数量、晶圆总数、完成率、产出统计

          5. **get_lot_info** - 查询Lot批次信息
             - 输入：lot_id（可选）、machine_id（可选）
             - 返回：Lot详细信息、当前状态、工艺步骤

          6. **get_recipe_info** - 查询工艺配方
             - 输入：machine_id（可选）
             - 返回：温度、压力、RF功率、气体流量、工艺时间

          7. **get_wafer_flow** - 查询OXE机台晶圆流向（OXE专用）
             - 输入：machine_id（必填）、lot_id（可选）
             - 返回：晶圆在Chamber间的流转路径、当前位置、加工状态

          8. **get_chamber_status** - 查询OXE机台Chamber状态（OXE专用）
             - 输入：machine_id（必填）
             - 返回：各Chamber的运行状态、当前晶圆、工艺阶段

          9. **get_oxe_lot_summary** - 查询OXE机台Lot汇总（OXE专用）
             - 输入：machine_id（必填）、date（可选）、lot_id（可选）
             - 返回：指定日期的Lot列表、每个Lot的晶圆数和完成进度

          ## 回答规范

          1. **先思考再行动**：先分析用户问题，判断是否需要调用工具，再决定调用哪个工具。
          2. **结构化回答**：
             - 状态类问题：用表格展示关键指标
             - 告警类问题：按等级分类，高亮严重告警
             - Lot类问题：展示 Lot ID、当前步骤、预计完成时间
             - 产量类问题：展示完成率、数量、趋势描述
          3. **跳转回放标记**：当你的回答涉及某个具体时间点的事件或告警时，在回答最末尾追加跳转标记（用户不可见，FabTwin前端会自动识别并删除）：
             ```
             [JUMP: YYYY-MM-DD HH:MM:SS] [MACHINE: 机台ID]
             ```
             - 时间格式必须是 `YYYY-MM-DD HH:MM:SS`
             - 机台ID是用户询问的那台机台（如 OXE-01）
             - 多个时间点只取最近一个
             - 如果回答不涉及具体时间点，不要输出跳转标记
             示例：用户问「OXE-01 最近有什么告警」，回答末尾追加：
             `[JUMP: 2026-09-02 14:23:01] [MACHINE: OXE-01]`
          4. **数据来源**：每次回答末尾注明数据来源（实时/历史/RAG知识库）。
          5. **不知道就说不知道**：如果工具返回的数据不足以回答问题，如实告知用户。

          ## 当前上下文

          - 当前机台：{{machine_id}}（如果非空，说明用户在该机台详情页提问，所有查询应使用此ID，不用再问用户）
          - 用户角色：{{user_role}}

          请用中文回答，语言简洁专业，符合半导体行业用语习惯。

      - role: user
        text: '{{#query#}}'

  completion_prompt_config: {}

  # -------- 对话变量（双写：variables 老版 + conversation_variables 新版） --------
  variables:
    - label: 当前机台ID
      key: machine_id
      type: text-input
      default: ''
      max_length: 100
      required: false
      description: 当前查看的机台ID，如 PODOPENER-1、OXE-01

    - label: 用户角色
      key: user_role
      type: select
      default: user
      options:
        - user
        - engineer
        - admin
      required: false
      description: 用户角色，影响可访问的数据范围

  conversation_variables:
    - label: 当前机台ID
      key: machine_id
      type: text-input
      default: ''
      max_length: 100
      required: false
      description: 当前查看的机台ID，如 PODOPENER-1、OXE-01

    - label: 用户角色
      key: user_role
      type: select
      default: user
      options:
        - user
        - engineer
        - admin
      required: false
      description: 用户角色，影响可访问的数据范围

  # -------- 数据集 / RAG 配置 --------
  dataset_configs:
    retrieval_model: multiple
    dataset_query_variable: null

  # -------- 文件上传（与您导出的模板结构保持一致：image子块 + enabled双层） --------
  file_upload:
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
        - remote_url
        - local_file
    enabled: true
    allowed_file_types:
      - document
      - image
    allowed_file_extensions:
      - .txt
      - .md
      - .pdf
      - .csv
      - .png
      - .jpg
      - .jpeg
    number_limit: 5

  # -------- 模型：字段与您 DC 环境导出模板 100% 一致 --------
  model:
    completion_params: {}
    mode: chat
    name: gpt-5.3-codex
    provider: langgenius/azure_openai/azure_openai

# -------- 应用级配置 --------
more_like_this:
  enabled: false

opening_statement: |
  👋 你好！我是 FabTwin Pro 数字孪生 AI 助手。

  我可以帮你：
  • 查询机台实时状态和运行模式
  • 查看告警记录和事件时间线
  • 查询 Lot 批次进度和产量统计
  • 了解工艺配方参数
  • 跳转到历史回放时间点

  试试问我：
  "OXE-01 现在状态怎么样？"
  "今天有什么严重告警？"
  "最近的 Lot 进度如何？"

pre_prompt: null

# simple / advanced；Dify Chat 应用默认 simple
prompt_type: simple

# -------- 知识库引用溯源（FabTwin 前端必填） --------
retriever_resource:
  enabled: true

# -------- 敏感词规避 --------
sensitive_word_avoidance:
  config: {}
  enabled: false
  type: ''

# -------- 语音 --------
speech_to_text:
  enabled: false

text_to_speech:
  enabled: false

# -------- 建议问题（空，FabTwin 前端自有快捷问题） --------
suggested_questions: []

suggested_questions_after_answer:
  enabled: false

# -------- 用户输入表单（空，靠 {{machine_id}} {{user_role}} 变量传） --------
user_input_form: []

# ================================================================
# DSL 版本号（与用户 DC 环境导出一致）
# ================================================================
version: 0.6.0
