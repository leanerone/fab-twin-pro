<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VPO 2D/3D Unified Dashboard</title>
  <style>
    :root {
      --bg: #e9eef3;
      --surface: #ffffff;
      --surface-2: #f7f9fb;
      --ink: #111827;
      --muted: #64748b;
      --line: #cbd5e1;
      --line-strong: #94a3b8;
      --accent: #0f766e;
      --accent-2: #2563eb;
      --idle: #9ca3af;
      --running: #16a34a;
      --hold: #d97706;
      --alarm: #dc2626;
      --maintenance: #2563eb;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.09)
    }

    * {
      box-sizing: border-box
    }

    body,
    html {
      margin: 0;
      width: 100%;
      height: 100%;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif
    }

    button,
    select {
      font: inherit
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100%;
      min-width: 320px
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(15, 23, 42, .04)
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      align-items: center
    }

    .btn,
    .select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface)
    }

    .btn {
      padding: 0 11px;
      cursor: pointer;
      white-space: nowrap
    }

    .btn:hover {
      border-color: var(--line-strong);
      background: var(--surface-2)
    }

    .btn.primary {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent)
    }

    .btn.primary:hover {
      background: #0b625b
    }

    .select {
      padding: 0 32px 0 10px
    }

    .main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      min-height: 0;
      padding: 12px;
      position: relative
    }

    .main>.panel {
      min-height: 0
    }

    body.embed-mode {
      background: 0 0
    }

    body.embed-mode .app {
      grid-template-rows: 1fr
    }

    body.embed-mode .bottom,
    body.embed-mode .lot-overlay,
    body.embed-mode .topbar {
      display: none
    }

    body.embed-mode .main {
      padding: 0;
      gap: 0;
      height: 100%
    }

    body.embed-mode .panel {
      border: 0;
      border-radius: 0;
      box-shadow: none
    }

    body.embed-mode .view-panel {
      height: 100%
    }

    body.embed-mode .view-wrap {
      height: 100%;
      min-height: 0
    }

    .view-tabs {
      display: inline-flex;
      gap: 8px;
      padding: 0 12px
    }

    .view-tab {
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .78);
      cursor: pointer;
      transition: border-color 140ms ease, color 140ms ease, background 140ms ease, transform 140ms ease
    }

    .view-tab:hover {
      border-color: var(--line-strong);
      color: var(--ink);
      transform: translateY(-1px)
    }

    .view-tab.active {
      border-color: rgba(37, 99, 235, .4);
      color: var(--accent-2);
      background: rgba(219, 234, 254, .8)
    }

    .view-panel.hidden {
      display: none
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc
    }

    .panel-title strong {
      display: block;
      font-size: 14px;
      line-height: 1.2
    }

    .panel-title span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      white-space: nowrap
    }

    .view-wrap {
      position: relative;
      height: calc(100% - 45px);
      min-height: 280px;
      background: linear-gradient(180deg, #f8fafc 0, #edf2f7 100%)
    }

    #map2d,
    #stage3dCanvas,
    #stage3dSvg {
      width: 100%;
      height: 100%;
      display: block
    }

    #map2d {
      background: linear-gradient(180deg, #f8fafc 0, #edf2f7 100%)
    }

    #stage3dCanvas {
      background: linear-gradient(180deg, #f7fafc 0, #e8eef5 100%);
      cursor: grab;
      position: absolute;
      inset: 0;
      z-index: 1
    }

    #stage3dSvg {
      display: none
    }

    .preview-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f8fafc
    }

    .view-tip {
      position: absolute;
      right: 10px;
      bottom: 10px;
      max-width: calc(100% - 20px);
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, .9);
      font-size: 12px
    }

    .legend {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: calc(100% - 20px)
    }

    .legend-item {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .92);
      font-size: 11px
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--idle)
    }

    .lot-overlay {
      position: fixed;
      left: 24px;
      top: 150px;
      z-index: 50;
      display: grid;
      gap: 10px;
      pointer-events: none
    }

    .lot-chip {
      pointer-events: auto;
      display: inline-flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-start;
      justify-self: start;
      min-width: 220px;
      max-width: min(360px, calc(100vw - 48px));
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 14px;
      color: #0f172a;
      background: rgba(255, 255, 255, .16);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .24), 0 4px 10px rgba(15, 23, 42, .04);
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease
    }

    .lot-chip.active,
    .lot-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, .38);
      background: rgba(255, 255, 255, .22)
    }

    .lot-chip .label {
      color: rgba(15, 23, 42, .52);
      font-size: 11px;
      line-height: 1.2;
      letter-spacing: .02em
    }

    .lot-chip .value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: .01em;
      color: var(--accent-2);
      text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
      overflow-wrap: anywhere
    }

    .lot-popover {
      pointer-events: auto;
      min-width: 260px;
      max-width: min(420px, calc(100vw - 48px));
      padding: 12px 14px 14px;
      border: 1px solid rgba(148, 163, 184, .45);
      border-radius: 16px;
      color: #0f172a;
      background: rgba(15, 23, 42, .56);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 42px rgba(15, 23, 42, .26);
      transform-origin: top left;
      transition: opacity 140ms ease, transform 140ms ease
    }

    .lot-popover.hidden {
      opacity: 0;
      transform: translateY(-4px) scale(.98);
      pointer-events: none
    }

    .lot-popover-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px
    }

    .lot-popover-head strong {
      color: #fff;
      font-size: 13px;
      line-height: 1.2
    }

    .lot-popover-head span {
      color: rgba(226, 232, 240, .8);
      font-size: 11px
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px
    }

    .detail-card {
      min-height: 70px;
      padding: 9px 10px;
      border: 1px solid rgba(148, 163, 184, .22);
      border-radius: 10px;
      background: rgba(255, 255, 255, .08)
    }

    .detail-card span {
      display: block;
      color: rgba(226, 232, 240, .76);
      font-size: 11px;
      line-height: 1.2
    }

    .detail-card strong {
      display: block;
      margin-top: 5px;
      color: #fff;
      font-size: 17px;
      line-height: 1.15;
      overflow-wrap: anywhere
    }

    .detail {
      min-height: 0;
      padding: 12px;
      overflow: auto
    }

    .detail h2 {
      margin: 0 0 10px;
      font-size: 15px
    }

    .kv {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 7px 10px;
      align-items: start;
      font-size: 12px;
      line-height: 1.4
    }

    .kv .k {
      color: var(--muted)
    }

    .kv .v {
      color: var(--ink);
      overflow-wrap: anywhere
    }

    .binding-list {
      display: grid;
      gap: 7px;
      margin-top: 14px
    }

    .binding-item {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      cursor: pointer;
      text-align: left
    }

    .binding-item.active,
    .binding-item:hover {
      border-color: var(--accent-2);
      background: #eff6ff
    }

    .binding-item span,
    .binding-item strong {
      display: block
    }

    .binding-item strong {
      font-size: 12px
    }

    .binding-item span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3
    }

    .bottom {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr minmax(160px, 260px);
      gap: 12px;
      align-items: center;
      padding: 10px 12px 12px;
      border-top: 1px solid var(--line);
      background: var(--surface)
    }

    .timeline-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4
    }

    .timeline-label strong {
      display: block;
      color: var(--ink);
      font-size: 13px
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(var(--count), minmax(38px, 1fr));
      gap: 8px;
      min-width: 0
    }

    .tick {
      position: relative;
      min-width: 0;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      cursor: pointer;
      overflow: hidden;
      text-align: left
    }

    .tick::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: var(--state-color, var(--idle))
    }

    .tick.active {
      border-color: var(--accent-2);
      box-shadow: inset 0 0 0 1px var(--accent-2);
      background: #eff6ff
    }

    .tick span,
    .tick strong {
      display: block;
      margin-left: 11px;
      margin-right: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .tick strong {
      margin-top: 6px;
      font-size: 11px;
      color: var(--ink)
    }

    .tick span {
      margin-top: 1px;
      font-size: 10px;
      color: var(--muted)
    }

    .load-status {
      justify-self: end;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: right;
      overflow-wrap: anywhere
    }

    .hotspot {
      transition: fill 160ms ease, stroke 160ms ease, opacity 160ms ease, stroke-width 160ms ease;
      cursor: pointer
    }

    .hotspot-label {
      pointer-events: none;
      font-size: 18px;
      fill: #0f172a;
      paint-order: stroke;
      stroke: rgba(248, 250, 252, 0.9);
      stroke-width: 5px;
      stroke-linejoin: round
    }

    .grid-line {
      stroke: #dbe5ef;
      stroke-width: 1
    }

    .machine-outline {
      fill: none;
      stroke: #334155;
      stroke-width: 2;
      stroke-dasharray: 8 7;
      opacity: .42
    }

    .machine-label {
      fill: #334155;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0
    }

    .detail-line {
      stroke: #64748b;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: .72
    }

    .small-detail {
      fill: #475569;
      stroke: #1f2937;
      stroke-width: 1
    }

    .port-pin {
      fill: #f8fafc;
      stroke: #334155;
      stroke-width: 1
    }

    @keyframes pulseStroke {

      0%,
      100% {
        stroke-opacity: 1
      }

      50% {
        stroke-opacity: 0.25
      }
    }

    .alarm-pulse {
      animation: pulseStroke .9s ease-in-out infinite
    }

    @media (max-width:1180px) {

      body,
      html {
        overflow: auto
      }

      .app {
        min-height: 100%;
        height: auto
      }

      .main {
        grid-template-columns: 1fr;
        grid-template-rows: 440px
      }

      .lot-overlay {
        left: 12px;
        right: 12px;
        top: 96px
      }

      .lot-chip,
      .lot-popover {
        max-width: calc(100vw - 24px)
      }

      .detail-grid {
        grid-template-columns: 1fr
      }

      .bottom {
        grid-template-columns: 1fr
      }

      .load-status {
        justify-self: stretch;
        text-align: left
      }
    }

    @media (max-width:760px) {
      .topbar {
        grid-template-columns: 1fr
      }

      .toolbar {
        justify-content: flex-start
      }

      .main {
        grid-template-columns: 1fr;
        grid-template-rows: 420px
      }

      .timeline {
        grid-template-columns: 1fr
      }

      .tick {
        height: 38px
      }
    }
  </style>
</head>
