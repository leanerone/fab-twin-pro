<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OXE 2.5D Unified Dashboard</title>
  <style>
    :root {
      --bg: #eaf0f4;
      --surface: #ffffff;
      --surface-soft: #f6f9fc;
      --ink: #0f172a;
      --muted: #607089;
      --line: #c7d3e0;
      --accent: #0e7490;
      --ok: #16a34a;
      --warn: #ca8a04;
      --alarm: #dc2626;
      --idle: #94a3b8;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.11)
    }

    * {
      box-sizing: border-box
    }

    body,
    html {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--ink);
      background: radial-gradient(circle at 15% -20%, #fff 0, #e8eff5 50%, #dde7ef 100%);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      min-width: 340px
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(5px)
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px
    }

    .btn,
    .select {
      min-height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0 11px
    }

    .btn {
      cursor: pointer
    }

    .btn:hover {
      border-color: #91a4ba
    }

    .btn.primary {
      color: #fff;
      border-color: #0c677f;
      background: linear-gradient(180deg, #0e87a7 0, #0b6f8b 100%)
    }

    .btn.primary:hover {
      filter: brightness(.96)
    }

    .select {
      padding-right: 28px
    }

    .main {
      display: grid;
      grid-template-columns: minmax(560px, 1.45fr) 360px;
      gap: 12px;
      min-height: 0;
      padding: 12px
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft)
    }

    .panel-title strong {
      font-size: 14px
    }

    .panel-title span {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted)
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 0 8px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap
    }

    .view-wrap {
      position: relative;
      height: calc(100% - 48px);
      min-height: 320px;
      background: linear-gradient(180deg, #f4f8fc 0, #e5eef6 100%)
    }

    #isoCanvas {
      width: 100%;
      height: 100%;
      display: block
    }

    .legend {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: calc(100% - 20px)
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 7px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      font-size: 11px
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block
    }

    .lot-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      min-width: 310px;
      max-width: 460px;
      padding: 10px 14px;
      border: 1px solid #a6b7ca;
      border-radius: 12px;
      background: rgba(232, 242, 252, .88);
      box-shadow: 0 8px 20px rgba(15, 23, 42, .14);
      backdrop-filter: blur(2px);
      z-index: 2;
      font-size: 13px
    }

    .lot-line {
      display: block;
      line-height: 1.45;
      font-weight: 600;
      color: #0f172a
    }

    .lot-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: start
    }

    .lot-col.right {
      text-align: right
    }

    .status-text {
      font-weight: 700;
      margin-left: 4px
    }

    .status-running-text {
      color: #16a34a
    }

    .status-alarm-text {
      color: #dc2626
    }

    .status-idle-text {
      color: #64748b
    }

    .status-info-text {
      color: #0e7490
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft)
    }

    .kpi {
      min-height: 72px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px
    }

    .kpi span {
      display: block;
      color: var(--muted);
      font-size: 11px
    }

    .kpi strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
      line-height: 1.1
    }

    .timeline {
      height: calc(100% - 165px);
      min-height: 180px;
      overflow: auto;
      padding: 10px;
      font-size: 12px
    }

    .event-row {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #edf2f7
    }

    .event-time {
      color: var(--muted);
      font-family: ui-monospace, "Cascadia Mono", monospace
    }

    .status-idle {
      color: var(--idle)
    }

    .status-running {
      color: var(--ok)
    }

    .status-hold {
      color: var(--warn)
    }

    .status-alarm {
      color: var(--alarm)
    }

    @media (max-width:1080px) {
      .main {
        grid-template-columns: 1fr
      }

      .timeline {
        height: 240px
      }
    }
  </style>
</head>

        <h1>OXE 2D 机台演示看板</h1>
        <div class="subtitle">平面2D视角 · ARM中心布局 · PORT/CHAMBER 邻接动作演示</div>
      </div>
      <div class="toolbar"><label style="font-size:12px;color:#607089">Tool ID</label> <input id="toolIdInput"
          class="select" style="width:130px;padding-right:10px" value="OXE-65A"> <label
          style="font-size:12px;color:#607089">Chamber 数量</label> <select id="chamberCount" class="select">
          <option value="2">2 Chamber</option>
          <option value="3" selected="selected">3 Chamber</option>
        </select> <button class="btn" id="btnLive">实时监听RV</button> <button class="btn" id="btnHistory">DB历史回放</button>
        <button class="btn" id="btnDisconnect">断开实时</button> <button class="btn primary" id="btnReplay">Mock

    </div>
    <div class="main">
      <div class="panel">

              ARM(HEX)</span></div><span class="badge" id="machineState">Idle</span>
        </div>
        <div class="view-wrap">
          <div id="lotStatusPanel" class="lot-panel"></div><canvas id="isoCanvas"></canvas>
          <div class="legend">
            <div class="legend-item"><span class="dot" style="background:#16a34a"></span>Running</div>
            <div class="legend-item"><span class="dot" style="background:#ca8a04"></span>Hold</div>
            <div class="legend-item"><span class="dot" style="background:#dc2626"></span>Alarm</div>
            <div class="legend-item"><span class="dot" style="background:#94a3b8"></span>Idle</div>
            <div class="legend-item"><span class="dot" style="background:#ef4444"></span>LOCK 角标</div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title"><strong>事件进程</strong> <span>来自 RV.log + EVENT 表</span></div>
        </div>
        <div class="kpis">
          <div class="kpi"><span>LOT</span><strong id="kpiLot">-</strong></div>
          <div class="kpi"><span>Recipe</span><strong id="kpiRecipe">-</strong></div>
          <div class="kpi"><span>当前 Event</span><strong id="kpiEvent">-</strong></div>
          <div class="kpi"><span>状态</span><strong id="kpiState" class="status-idle">Idle</strong></div>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </div>
